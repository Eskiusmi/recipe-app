  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500&family=Playfair+Display:wght@600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#0f0f0f;--surface:#1a1a1a;--surface2:#222;--border:rgba(255,255,255,.08);--border-hover:rgba(255,255,255,.18);--text:#f0ede8;--text-muted:#888880;--text-hint:#555550;--accent:#c8a96e;--accent-dim:rgba(200,169,110,.12);--green:#5a9e6f;--green-dim:rgba(90,158,111,.12);--red-dim:rgba(180,80,80,.12);--red:#b45050;--blue-dim:rgba(80,120,180,.12);--blue:#5078b4;--radius:16px;--radius-sm:10px;--font-display:'Noto Serif SC',serif;--font-body:'Noto Sans SC',sans-serif}
    body.lang-en,body.lang-fr,body.lang-es{--font-display:'Playfair Display',serif;--font-body:'Lato',sans-serif}
    *{box-sizing:border-box;margin:0;padding:0}body{font-family:var(--font-body);background:var(--bg);color:var(--text);min-height:100vh;display:flex;justify-content:center;padding:0 16px 60px;-webkit-font-smoothing:antialiased}.container{width:100%;max-width:480px}
    .lang-switcher{display:flex;justify-content:flex-end;padding-top:20px;position:relative}.lang-dropdown{position:relative}.lang-trigger{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--text-muted);font-size:12px;cursor:pointer;font-family:var(--font-body);transition:all .2s}.lang-trigger:hover{border-color:var(--accent);color:var(--accent)}.lang-trigger:disabled{opacity:.4;cursor:not-allowed}.lang-trigger .lang-arrow{font-size:10px;transition:transform .2s}.lang-dropdown.open .lang-trigger .lang-arrow{transform:rotate(180deg)}.lang-menu{position:absolute;top:calc(100% + 6px);right:0;background:var(--surface);border:1px solid var(--border-hover);border-radius:var(--radius-sm);padding:4px;min-width:140px;opacity:0;visibility:hidden;transform:translateY(-8px);transition:all .2s;z-index:100;box-shadow:0 10px 30px rgba(0,0,0,.4)}.lang-dropdown.open .lang-menu{opacity:1;visibility:visible;transform:translateY(0)}.lang-option{width:100%;text-align:left;padding:8px 12px;border:none;background:transparent;color:var(--text-muted);font-size:13px;cursor:pointer;font-family:var(--font-body);border-radius:var(--radius-sm);transition:all .15s;display:flex;align-items:center;justify-content:space-between}.lang-option:hover{background:var(--surface2);color:var(--text)}.lang-option.active{background:var(--accent-dim);color:var(--accent)}.lang-option .check{opacity:0;font-size:12px}.lang-option.active .check{opacity:1}

    .sort-bar{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}.sort-chip{font-size:11px;padding:5px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--border);color:var(--text-hint);cursor:pointer;font-family:var(--font-body);transition:all .2s;display:inline-flex;align-items:center;gap:4px}.sort-chip:hover{border-color:var(--accent);color:var(--accent)}.sort-chip.active{background:var(--accent-dim);border-color:var(--accent);color:var(--accent)}.sort-arrow{font-size:10px;transition:transform .2s}.sort-chip.desc .sort-arrow{transform:rotate(180deg)}
    .recipe-cards{display:flex;flex-direction:column;gap:14px;margin-bottom:20px}.recipe-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;transition:border-color .2s}.recipe-card:hover{border-color:var(--border-hover)}.recipe-card-header{padding:18px 20px 14px;cursor:pointer;user-select:none;display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.recipe-card-left{flex:1}.recipe-num{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--accent);margin-bottom:5px;font-weight:500}.recipe-name{font-family:var(--font-display);font-size:20px;font-weight:600;margin-bottom:10px;line-height:1.3}.recipe-meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.badge{font-size:11px;padding:3px 9px;border-radius:999px;font-weight:500}.badge-time{background:var(--accent-dim);color:var(--accent)}.badge-easy{background:var(--green-dim);color:var(--green)}.badge-medium{background:var(--blue-dim);color:var(--blue)}.badge-hard{background:var(--red-dim);color:var(--red)}.badge-cal{background:var(--surface2);color:var(--text-hint);border:1px solid var(--border)}.share-btn{font-size:11px;padding:3px 9px;border-radius:999px;background:var(--surface2);color:var(--text-hint);border:1px solid var(--border);cursor:pointer;font-family:var(--font-body);transition:all .2s;white-space:nowrap}.share-btn:hover{border-color:var(--accent);color:var(--accent)}.share-btn.copied{background:var(--green-dim);color:var(--green);border-color:rgba(90,158,111,.3)}.recipe-toggle{width:28px;height:28px;border-radius:50%;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--text-muted);flex-shrink:0;transition:all .3s;margin-top:4px}.recipe-card.open .recipe-toggle{transform:rotate(180deg);background:var(--accent-dim);color:var(--accent)}.recipe-body{max-height:0;overflow:hidden;transition:max-height .4s cubic-bezier(.4,0,.2,1)}.recipe-card.open .recipe-body{max-height:1200px}.recipe-body-inner{padding:16px 20px 20px;border-top:1px solid var(--border)}.body-label{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-hint);margin-bottom:10px}.recipe-ings{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:18px}.recipe-ing-chip{font-size:11px;padding:3px 9px;border-radius:999px;background:var(--surface2);color:var(--text-muted);border:1px solid var(--border)}.steps-list{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}.step{display:flex;gap:12px;align-items:flex-start}.step-num{width:22px;height:22px;border-radius:50%;background:var(--surface2);border:1px solid var(--border);color:var(--text-hint);font-size:11px;font-weight:500;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}.step-text{font-size:13px;color:var(--text-muted);line-height:1.65;font-weight:300}.tip-box{background:var(--accent-dim);border:1px solid rgba(200,169,110,.15);border-radius:var(--radius-sm);padding:10px 14px;font-size:12px;color:var(--accent);line-height:1.6}.tip-label{font-weight:600;margin-right:4px}
    .history-panel{display:none;animation:fadeUp .4s ease both}.history-panel-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;padding-top:8px}.history-panel-title{font-family:var(--font-display);font-size:18px;font-weight:600}.history-clear{font-size:12px;color:var(--red);background:none;border:none;cursor:pointer;font-family:var(--font-body);padding:4px 8px;border-radius:var(--radius-sm)}.history-empty{text-align:center;padding:40px 0;color:var(--text-hint);font-size:14px}.history-list{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}.history-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;cursor:pointer;transition:all .2s}.history-item:hover{border-color:var(--border-hover);transform:translateY(-1px)}.history-item-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}.history-item-time{font-size:11px;color:var(--text-hint)}.history-item-meta{display:flex;gap:6px}.history-item-count{font-size:11px;color:var(--text-hint);background:var(--surface2);padding:2px 8px;border-radius:999px}.history-item-lang{font-size:11px;color:var(--accent);background:var(--accent-dim);padding:2px 8px;border-radius:999px}.history-item-ings{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}.history-ing{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--accent-dim);color:var(--accent);border:1px solid rgba(200,169,110,.15)}.history-item-recipes{font-size:12px;color:var(--text-muted);line-height:1.6}

<body class="lang-zh">
<div class="container">
  <div class="lang-switcher"><div class="lang-dropdown" id="langDropdown"><button class="lang-trigger" id="langTrigger" onclick="toggleLangDropdown(event)"><span id="langCurrentLabel">中文</span><span class="lang-arrow">▾</span></button><div class="lang-menu"><button class="lang-option active" data-lang="zh" onclick="switchLang('zh')"><span>中文</span><span class="check">✓</span></button><button class="lang-option" data-lang="en" onclick="switchLang('en')"><span>English</span><span class="check">✓</span></button><button class="lang-option" data-lang="fr" onclick="switchLang('fr')"><span>Français</span><span class="check">✓</span></button><button class="lang-option" data-lang="es" onclick="switchLang('es')"><span>Español</span><span class="check">✓</span></button></div></div></div>
  <div class="header"><div class="header-eyebrow" id="t-eyebrow">AI 菜谱助手</div><h1 id="t-title">今天吃什么</h1><p id="t-subtitle">拍下冰箱里的食材，AI 帮你决定</p></div>

  <div id="screen-upload">
    <div class="upload-area" id="uploadArea" onclick="document.getElementById('fileInput').click()"><span class="upload-icon">📷</span><div class="upload-title" id="t-uploadTitle">拍照或上传食材图片</div><div class="upload-sub" id="t-uploadSub">支持 JPG、PNG、WebP</div><img id="preview" alt="preview"></div>
    <input type="file" id="fileInput" accept="image/*" capture="environment">
    <button class="btn" id="detectBtn" disabled onclick="runFromPhoto()" style="margin-bottom:12px">识别食材</button>
    <div class="manual-entry"><button class="manual-link" onclick="goManual()" id="t-manualLink">不想拍照？直接输入食材 →</button></div>
  </div>

  <div class="loading" id="loading"><div class="spinner-wrap"><div class="spinner-ring"></div><div class="spinner-ring"></div><div class="spinner-ring"></div><div class="spinner-dot"></div></div><div class="loading-text" id="loadingText"></div><div class="loading-sub" id="loadingSub"></div></div>
  <div class="error-box" id="errorBox"><div class="error-msg" id="errorMsg"></div><div class="error-actions" id="errorActions"></div></div>

  <div class="manual-screen" id="screen-manual">
    <div class="manual-screen-header"><div class="manual-screen-title" id="t-manualTitle">输入食材</div><div class="manual-screen-hint" id="t-manualHint">回车添加</div></div>
    <div class="tags-wrap"><div class="tags-list" id="tagsList"></div><div class="add-row"><input class="tag-input" id="tagInput" type="text"><button class="add-btn" onclick="addTag('tagInput',renderEditTags)" id="t-addBtn">+ 添加</button></div></div>
    <div class="suggestions-label" id="t-suggestLabel" style="display:none"></div>
    <div class="suggestions-row" id="suggestionsRow"></div>
    <div class="tag-count" id="tagCount"></div>
    <div class="prefs-panel"><div class="prefs-section"><div class="prefs-label" id="t-servingsLabel">份量</div><div class="prefs-row" id="servingsRow"></div></div><div class="prefs-section"><div class="prefs-label" id="t-dietaryLabel">饮食限制</div><div class="prefs-row" id="dietaryRow"></div></div><div class="prefs-section"><div class="prefs-label" id="t-styleLabel">烹饪方式</div><div class="prefs-row" id="styleRow"></div></div></div>
    <button class="btn" onclick="generateRecipes()" id="t-generateBtn">帮我想菜谱</button>
    <button class="btn-outline" onclick="resetAll()" id="t-backBtn">返回</button>
  </div>

  <div class="result" id="screen-result">
    <div class="result-header"><div class="result-title" id="t-resultTitle">为你推荐</div><div class="result-actions"><button class="history-btn" onclick="showHistory()" id="t-historyBtn">历史记录</button><div class="result-count" id="resultCount"></div></div></div>
    <div class="result-ing-bar">
      <div class="result-ing-bar-header"><div class="result-ing-label" id="t-ingLabel">使用的食材</div><div class="result-ing-edit-hint" id="t-ingEditHint">可修改后重新生成</div></div>
      <div class="result-tags-list" id="resultTagsList"></div>
      <div class="result-add-row"><input class="tag-input" id="resultTagInput" type="text"><button class="add-btn" onclick="addTag('resultTagInput',renderResultTags)" id="t-resultAddBtn">+ 添加</button></div>
      <div class="prefs-panel" style="margin-bottom:10px"><div class="prefs-section"><div class="prefs-label" id="t-rServingsLabel">份量</div><div class="prefs-row" id="rServingsRow"></div></div><div class="prefs-section"><div class="prefs-label" id="t-rDietaryLabel">饮食限制</div><div class="prefs-row" id="rDietaryRow"></div></div><div class="prefs-section"><div class="prefs-label" id="t-rStyleLabel">烹饪方式</div><div class="prefs-row" id="rStyleRow"></div></div></div>
      <button class="regen-btn" onclick="generateRecipes()" id="t-regenBtn">重新生成菜谱</button>
    </div>
    <!-- 排序栏 -->
    <div class="sort-bar" id="sortBar"></div>
    <div class="recipe-cards" id="recipeCards"></div>
    <button class="btn-outline" onclick="resetAll()" id="t-resultRetakeBtn">重新拍照</button>
  </div>

  <div class="history-panel" id="screen-history"><div class="history-panel-header"><div class="history-panel-title" id="t-historyTitle">历史记录</div><button class="history-clear" onclick="clearHistory()" id="t-historyClear">清空</button></div><div id="historyList"></div><button class="btn-outline" onclick="backFromHistory()" id="t-historyBack">返回</button></div>

  fr:{eyebrow:'Assistant Recettes IA',title:"Que manger aujourd'hui ?",subtitle:"Photographiez vos ingrédients",uploadTitle:'Photo ou importer',uploadSub:'JPG, PNG, WebP',detectBtn:'Identifier et générer',manualLink:'Pas de photo ? Saisir →',manualTitle:'Entrer ingrédients',manualHint:'Entrée pour ajouter',addBtn:'+ Ajouter',tagPlaceholder:'Ajouter...',suggestLabel:'Suggestions',suggestLoading:'IA en réflexion...',servingsLabel:'Portions',dietaryLabel:'Régime',styleLabel:'Style',servings:[{v:'1',l:'1 pers.'},{v:'2',l:'2 pers.'},{v:'3-4',l:'3-4 pers.'}],dietary:[{v:'vegetarian',l:'🥬 Végé'},{v:'lowCal',l:'🔥 Léger'},{v:'noSpicy',l:'🌶️ Non épicé'},{v:'noSeafood',l:'🐟 Sans mer'},{v:'noNuts',l:'🥜 Sans noix'}],styles:[{v:'any',l:'Tous'},{v:'stirFry',l:'🍳 Sauté'},{v:'soup',l:'🍲 Soupe'},{v:'steam',l:'♨️ Vapeur'},{v:'cold',l:'🥗 Salade'},{v:'noodle',l:'🍜 Pâtes'}],generateBtn:'Générer',backBtn:'Retour',resultTitle:'Recommandé',historyBtn:'Historique',ingLabel:'Ingrédients',ingEditHint:'Modifier et régénérer',resultAddBtn:'+ Ajouter',regenBtn:'Régénérer',resultRetakeBtn:'Reprendre',sortLabel:'Trier par',sortTime:'⏱ Temps',sortDifficulty:'📊 Difficulté',sortCalories:'🔥 Calories',historyTitle:'Historique',historyClear:'Effacer',historyBack:'Retour',historyEmpty:"Pas d'historique",recipesCount:n=>`${n} recette${n>1?'s':''}`,recipeLabels:['Recette 1','Recette 2','Recette 3'],ingredientsLabel:'Ingrédients',stepsLabel:'Étapes',shareBtn:'Copier',shareCopied:'✓ Copié',tagCountLabel:n=>n===0?'Ajoutez un ingrédient':`${n} ingrédient${n>1?'s':''}`,loadingPhoto:'Identification et génération',loadingPhotoSub:'~10-15 secondes',loadingGenerate:'Génération',loadingGenerateSub:'~8-12 secondes',loadingTips:['Identification...','Analyse...','Recherche...','Presque prêt...'],errNetwork:'Réseau instable',errNoIngredients:'Aucun ingrédient',errDetect:'Échec',errGenerate:'Erreur IA',errEmpty:'Ajoutez un ingrédient',errRetry:'Réessayer',errManual:'Saisir',errRetake:'Reprendre',confirmClear:'Effacer tout ?'}

const HISTORY_KEY='recipe_history',MAX_HISTORY=10,LANG_LABELS={zh:'中文',en:'English',fr:'Français',es:'Español'};

// 生产环境留空（前后端同域），本地测试改成 'http://192.168.x.x:3000'
const API_BASE = '';
let ingredients=[],currentLang='zh',prevScreen='screen-result',tipTimer=null,isLoading=false,currentRequestId=0;
let selectedServings='1-2',selectedDietary=[],selectedStyle='any';
let currentSort='none',currentSortDir='asc';
function t(){return I18N[currentLang]||I18N.zh}
const SYNONYMS={'番茄':['西红柿'],'土豆':['马铃薯','洋芋'],tomato:['tomatoes'],potato:['potatoes'],egg:['eggs'],onion:['onions','scallion']};
function isSemanticDuplicate(a,b){const l=a.toLowerCase();for(const x of b){const xl=x.toLowerCase();if(xl===l)return true;for(const[k,s]of Object.entries(SYNONYMS)){const all=[k.toLowerCase(),...s.map(v=>v.toLowerCase())];if(all.includes(l)&&all.includes(xl))return true}}return false}

function renderPrefs(cid,type){const tx=t();if(type==='servings')document.getElementById(cid).innerHTML=tx.servings.map(s=>`<button class="pref-chip${s.v===selectedServings?' active':''}" onclick="setServings('${s.v}')">${s.l}</button>`).join('');else if(type==='dietary')document.getElementById(cid).innerHTML=tx.dietary.map(d=>`<button class="pref-chip${selectedDietary.includes(d.v)?' active':''}" onclick="toggleDietary('${d.v}')">${d.l}</button>`).join('');else if(type==='style')document.getElementById(cid).innerHTML=tx.styles.map(s=>`<button class="pref-chip${s.v===selectedStyle?' active':''}" onclick="setStyle('${s.v}')">${s.l}</button>`).join('')}
function renderAllPrefs(){renderPrefs('servingsRow','servings');renderPrefs('dietaryRow','dietary');renderPrefs('styleRow','style');renderPrefs('rServingsRow','servings');renderPrefs('rDietaryRow','dietary');renderPrefs('rStyleRow','style')}
function setServings(v){selectedServings=v;renderAllPrefs()}
function toggleDietary(v){const i=selectedDietary.indexOf(v);i===-1?selectedDietary.push(v):selectedDietary.splice(i,1);renderAllPrefs()}
function setStyle(v){selectedStyle=v;renderAllPrefs()}

function toggleLangDropdown(e){if(e)e.stopPropagation();if(isLoading)return;document.getElementById('langDropdown').classList.toggle('open')}
document.addEventListener('click',e=>{const dd=document.getElementById('langDropdown');if(dd&&!dd.contains(e.target))dd.classList.remove('open')});
function switchLang(lang){if(isLoading)return;currentLang=lang;document.body.className=`lang-${lang}`;document.querySelector('html').lang=lang;document.getElementById('langCurrentLabel').textContent=LANG_LABELS[lang];document.querySelectorAll('.lang-option').forEach(o=>o.classList.toggle('active',o.dataset.lang===lang));document.getElementById('langDropdown').classList.remove('open');applyI18n();localStorage.setItem('recipe_lang',lang)}
function applyI18n(){const tx=t(),s=(id,v)=>{const el=document.getElementById(id);if(el)el.textContent=v};s('t-eyebrow',tx.eyebrow);s('t-title',tx.title);s('t-subtitle',tx.subtitle);s('t-uploadTitle',tx.uploadTitle);s('t-uploadSub',tx.uploadSub);const db=document.getElementById('detectBtn');if(db)db.textContent=tx.detectBtn;s('t-manualLink',tx.manualLink);s('t-manualTitle',tx.manualTitle);s('t-manualHint',tx.manualHint);s('t-addBtn',tx.addBtn);document.getElementById('tagInput').placeholder=tx.tagPlaceholder;s('t-suggestLabel',tx.suggestLabel);s('t-servingsLabel',tx.servingsLabel);s('t-dietaryLabel',tx.dietaryLabel);s('t-styleLabel',tx.styleLabel);s('t-rServingsLabel',tx.servingsLabel);s('t-rDietaryLabel',tx.dietaryLabel);s('t-rStyleLabel',tx.styleLabel);s('t-generateBtn',tx.generateBtn);s('t-backBtn',tx.backBtn);s('t-resultTitle',tx.resultTitle);s('t-historyBtn',tx.historyBtn);s('t-ingLabel',tx.ingLabel);s('t-ingEditHint',tx.ingEditHint);s('t-resultAddBtn',tx.resultAddBtn);document.getElementById('resultTagInput').placeholder=tx.tagPlaceholder;s('t-regenBtn',tx.regenBtn);s('t-resultRetakeBtn',tx.resultRetakeBtn);s('t-historyTitle',tx.historyTitle);s('t-historyClear',tx.historyClear);s('t-historyBack',tx.historyBack);renderEditTags();renderAllPrefs()}

async function fixImageOrientation(file){return new Promise(r=>{const img=new Image;img.onload=()=>{const c=document.createElement('canvas'),ctx=c.getContext('2d'),mx=1600;let{width:w,height:h}=img;if(w>mx||h>mx){const ra=Math.min(mx/w,mx/h);w*=ra;h*=ra}c.width=w;c.height=h;ctx.drawImage(img,0,0,w,h);c.toBlob(b=>r(b||file),'image/jpeg',.85)};img.onerror=()=>r(file);img.src=URL.createObjectURL(file)})}
function showScreen(n){['screen-upload','screen-manual','screen-result','screen-history'].forEach(id=>{document.getElementById(id).style.display='none'});if(n){const el=document.getElementById(n);el.style.display='block';el.style.animation='none';requestAnimationFrame(()=>{el.style.animation=''})}}
function showLoading(t,s){document.getElementById('loadingText').textContent=t;document.getElementById('loadingSub').textContent=s;document.getElementById('loading').style.display='block';isLoading=true;document.getElementById('langTrigger').disabled=true;document.getElementById('langDropdown').classList.remove('open')}
function hideLoading(){document.getElementById('loading').style.display='none';if(tipTimer){clearInterval(tipTimer);tipTimer=null}isLoading=false;document.getElementById('langTrigger').disabled=false}
function startTips(){if(tipTimer)clearInterval(tipTimer);const tips=t().loadingTips;let i=0;tipTimer=setInterval(()=>{i=(i+1)%tips.length;const el=document.getElementById('loadingText');el.style.opacity='0';setTimeout(()=>{el.textContent=tips[i];el.style.opacity='1'},200)},3000)}
function showError(m,a=[]){document.getElementById('errorMsg').textContent=m;document.getElementById('errorActions').innerHTML=a.map(x=>`<button class="error-btn ${x.cls}" onclick="${x.fn}">${x.label}</button>`).join('');document.getElementById('errorBox').style.display='block'}
function hideError(){document.getElementById('errorBox').style.display='none'}

const fileInput=document.getElementById('fileInput'),uploadArea=document.getElementById('uploadArea'),detectBtn=document.getElementById('detectBtn');
fileInput.addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;document.getElementById('preview').src=URL.createObjectURL(f);document.getElementById('preview').style.display='block';uploadArea.querySelector('.upload-icon').style.display='none';document.getElementById('t-uploadTitle').style.display='none';document.getElementById('t-uploadSub').style.display='none';uploadArea.classList.add('has-image');detectBtn.disabled=false});
document.getElementById('tagInput').addEventListener('keydown',e=>{if(e.key==='Enter')addTag('tagInput',renderEditTags)});
document.getElementById('resultTagInput').addEventListener('keydown',e=>{if(e.key==='Enter')addTag('resultTagInput',renderResultTags)});
function addTag(id,fn){const input=document.getElementById(id),val=input.value.trim();if(!val||val.length>20)return input.value='';if(isSemanticDuplicate(val,ingredients))return input.value='';ingredients.push(val);input.value='';fn();if(id==='tagInput')fetchSuggestions()}
function removeTag(i,fn){ingredients.splice(i,1);fn();if(fn===renderEditTags)fetchSuggestions()}
function renderEditTags(){document.getElementById('tagsList').innerHTML=ingredients.map((g,i)=>`<div class="tag">${g}<button class="tag-del" onclick="removeTag(${i},renderEditTags)">×</button></div>`).join('');document.getElementById('tagCount').textContent=t().tagCountLabel(ingredients.length)}
function renderResultTags(){document.getElementById('resultTagsList').innerHTML=ingredients.map((g,i)=>`<div class="tag">${g}<button class="tag-del" onclick="removeTag(${i},renderResultTags)">×</button></div>`).join('')}
function goManual(){if(isLoading)return;hideError();ingredients=[];renderEditTags();document.getElementById('suggestionsRow').innerHTML='';document.getElementById('t-suggestLabel').style.display='none';showScreen('screen-manual')}

let suggestTimer=null;
async function fetchSuggestions(){if(!ingredients.length){document.getElementById('suggestionsRow').innerHTML='';document.getElementById('t-suggestLabel').style.display='none';return}clearTimeout(suggestTimer);suggestTimer=setTimeout(async()=>{const tx=t();document.getElementById('t-suggestLabel').style.display='block';document.getElementById('t-suggestLabel').textContent=tx.suggestLoading;try{const res=await fetch(`${API_BASE}/suggest`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ingredients,lang:currentLang})});const data=await res.json();if(data.success&&data.suggestions.length>0){document.getElementById('t-suggestLabel').textContent=tx.suggestLabel;document.getElementById('suggestionsRow').innerHTML=data.suggestions.map(s=>`<button class="suggestion-chip" onclick="addSuggestion('${s.replace(/'/g,"\\'")}')">${s}</button>`).join('')}else{document.getElementById('t-suggestLabel').style.display='none';document.getElementById('suggestionsRow').innerHTML=''}}catch{document.getElementById('t-suggestLabel').style.display='none'}},800)}
function addSuggestion(s){if(isSemanticDuplicate(s,ingredients))return;ingredients.push(s);renderEditTags();fetchSuggestions()}
function shareRecipe(btn,idx){const r=(window._currentRecipes||[])[idx];if(!r)return;const tx=t(),text=`【${r.name}】 ${r.time_min}min · ${r.difficulty} · ${r.calories}cal\n\n${tx.ingredientsLabel}: ${r.ingredients.join(', ')}\n\n${tx.stepsLabel}:\n${r.steps.map((s,i)=>`${i+1}. ${s}`).join('\n')}\n\n💡 ${r.tip}`;const finish=()=>{btn.textContent=tx.shareCopied;btn.classList.add('copied');setTimeout(()=>{btn.textContent=tx.shareBtn;btn.classList.remove('copied')},2000)};if(navigator.clipboard)navigator.clipboard.writeText(text).then(finish).catch(()=>fallbackCopy(text,finish));else fallbackCopy(text,finish)}
function fallbackCopy(text,cb){const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);cb()}

function loadHistory(){try{return JSON.parse(localStorage.getItem(HISTORY_KEY))||[]}catch{return[]}}
function saveToHistory(data){let h=loadHistory();h.unshift({id:Date.now(),time:new Date().toLocaleString(),lang:currentLang,ingredients:data.ingredients,recipes:data.recipes.map(r=>({name:r.name,time_min:r.time_min,difficulty:r.difficulty,calories:r.calories,ingredients:r.ingredients,steps:r.steps,tip:r.tip}))});while(h.length>0){try{const sl=h.slice(0,MAX_HISTORY),sr=JSON.stringify(sl);if(sr.length>3*1024*1024){h=h.slice(0,Math.max(1,h.length-1));continue}localStorage.setItem(HISTORY_KEY,sr);break}catch{if(h.length<=1){localStorage.removeItem(HISTORY_KEY);break}h=h.slice(0,h.length-1)}}}
function clearHistory(){if(!confirm(t().confirmClear))return;localStorage.removeItem(HISTORY_KEY);renderHistoryList()}
function showHistory(){if(isLoading)return;prevScreen=window._currentRecipes?'screen-result':'screen-upload';renderHistoryList();showScreen('screen-history')}
function backFromHistory(){showScreen(prevScreen)}
function renderHistoryList(){const h=loadHistory(),tx=t(),el=document.getElementById('historyList');if(!h.length){el.innerHTML=`<div class="history-empty">${tx.historyEmpty}</div>`;return}el.innerHTML='<div class="history-list">'+h.map(r=>`<div class="history-item" onclick="loadHistoryRecord(${r.id})"><div class="history-item-top"><div class="history-item-time">${r.time}</div><div class="history-item-meta"><div class="history-item-lang">${(r.lang||'zh').toUpperCase()}</div><div class="history-item-count">${tx.recipesCount(r.recipes.length)}</div></div></div><div class="history-item-ings">${r.ingredients.map(i=>`<span class="history-ing">${i}</span>`).join('')}</div><div class="history-item-recipes">${r.recipes.map(x=>x.name).join(' · ')}</div></div>`).join('')+'</div>'}
function loadHistoryRecord(id){const r=loadHistory().find(x=>x.id===id);if(!r)return;ingredients=[...r.ingredients];if(r.lang&&r.lang!==currentLang)switchLang(r.lang);renderResult({ingredients:r.ingredients,recipes:r.recipes},false);showScreen('screen-result')}

// ── 排序 ──
const DIFF_ORDER={zh:{'简单':1,'中等':2,'较难':3},en:{'Easy':1,'Medium':2,'Hard':3},fr:{'Facile':1,'Moyen':2,'Difficile':3},es:{'Fácil':1,'Medio':2,'Difícil':3}};
function getDiffNum(d){return(DIFF_ORDER[currentLang]||DIFF_ORDER.zh)[d]||2}
function sortRecipes(recipes,sortBy,dir){const sorted=[...recipes];if(sortBy==='time')sorted.sort((a,b)=>dir==='asc'?(a.time_min||0)-(b.time_min||0):(b.time_min||0)-(a.time_min||0));else if(sortBy==='difficulty')sorted.sort((a,b)=>dir==='asc'?getDiffNum(a.difficulty)-getDiffNum(b.difficulty):getDiffNum(b.difficulty)-getDiffNum(a.difficulty));else if(sortBy==='calories')sorted.sort((a,b)=>dir==='asc'?(a.calories||0)-(b.calories||0):(b.calories||0)-(a.calories||0));return sorted}
function toggleSort(sortBy){if(currentSort===sortBy){if(currentSortDir==='asc')currentSortDir='desc';else{currentSort='none';currentSortDir='asc'}}else{currentSort=sortBy;currentSortDir='asc'}renderSortBar();if(window._currentRecipes)renderRecipeCards(window._currentRecipes)}
function renderSortBar(){const tx=t(),sorts=[{k:'time',l:tx.sortTime},{k:'difficulty',l:tx.sortDifficulty},{k:'calories',l:tx.sortCalories}];document.getElementById('sortBar').innerHTML=sorts.map(s=>`<button class="sort-chip${currentSort===s.k?' active':''}${currentSort===s.k&&currentSortDir==='desc'?' desc':''}" onclick="toggleSort('${s.k}')">${s.l}<span class="sort-arrow">${currentSort===s.k?'↑':'·'}</span></button>`).join('')}

// ── 拍照流程（单次Claude调用） ──
async function runFromPhoto(){
  if(isLoading)return;const file=fileInput.files[0];if(!file)return;
  detectBtn.disabled=true;hideError();showScreen(null);const tx=t();showLoading(tx.loadingPhoto,tx.loadingPhotoSub);startTips();
  const reqId=++currentRequestId;
  try{
    const fixedFile=await fixImageOrientation(file);
    const fd=new FormData;fd.append('image',fixedFile,'photo.jpg');fd.append('lang',currentLang);fd.append('servings',selectedServings);fd.append('dietary',JSON.stringify(selectedDietary));fd.append('style',selectedStyle);
    const res=await fetch(`${API_BASE}/detect-and-generate`,{method:'POST',body:fd});
    if(reqId!==currentRequestId)return;if(!res.ok)throw{type:'network'};
    const data=await res.json();if(!data.success)throw{type:'api',msg:data.error};
    ingredients=[...data.data.ingredients];
    renderResult(data.data,true);showScreen('screen-result');
  }catch(err){if(reqId!==currentRequestId)return;showScreen('screen-upload');detectBtn.disabled=false;handleError(err,'runFromPhoto()')}
  finally{if(reqId===currentRequestId)hideLoading()}
}

async function generateRecipes(){
  if(isLoading)return;if(!ingredients.length){showError(t().errEmpty,[]);return}
  hideError();showScreen(null);const tx=t();showLoading(tx.loadingGenerate,tx.loadingGenerateSub);startTips();
  const reqId=++currentRequestId;
  try{
    const res=await fetch(`${API_BASE}/generate`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ingredients,lang:currentLang,servings:selectedServings,dietary:selectedDietary,style:selectedStyle})});
    if(reqId!==currentRequestId)return;if(!res.ok)throw{type:'network'};
    const data=await res.json();if(!data.success)throw{type:'api'};
    renderResult(data.data,true);showScreen('screen-result');
  }catch(err){if(reqId!==currentRequestId)return;showScreen(window._currentRecipes?'screen-result':'screen-manual');showError(err.type==='network'?tx.errNetwork:tx.errGenerate,[{label:tx.errRetry,cls:'error-btn-retry',fn:'generateRecipes()'}])}
  finally{if(reqId===currentRequestId)hideLoading()}
}

function handleError(err,retryFn){const tx=t();if(err.type==='network')showError(tx.errNetwork,[{label:tx.errRetry,cls:'error-btn-retry',fn:retryFn},{label:tx.errManual,cls:'error-btn-manual',fn:'goManual()'}]);else if(err.msg==='no_ingredients')showError(tx.errNoIngredients,[{label:tx.errRetake,cls:'error-btn-retry',fn:retryFn},{label:tx.errManual,cls:'error-btn-manual',fn:'goManual()'}]);else showError(tx.errDetect,[{label:tx.errRetry,cls:'error-btn-retry',fn:retryFn},{label:tx.errManual,cls:'error-btn-manual',fn:'goManual()'}])}

function diffBadge(d){const e=['简单','Easy','Facile','Fácil'],h=['较难','Hard','Difficile','Difícil'];if(e.includes(d))return`<span class="badge badge-easy">${d}</span>`;if(h.includes(d))return`<span class="badge badge-hard">${d}</span>`;return`<span class="badge badge-medium">${d}</span>`}

function renderResult(data,save=true){
  ingredients=[...data.ingredients];window._currentRecipes=data.recipes;if(save)saveToHistory(data);
  renderResultTags();renderAllPrefs();renderSortBar();
  const tx=t();document.getElementById('resultCount').textContent=tx.recipesCount(data.recipes.length);
  renderRecipeCards(data.recipes);
}
function renderRecipeCards(recipes){
  const tx=t();
  const sorted=currentSort!=='none'?sortRecipes(recipes,currentSort,currentSortDir):recipes;
  document.getElementById('recipeCards').innerHTML=sorted.map((r,idx)=>`<div class="recipe-card" style="animation:fadeUp .5s ${idx*.08}s ease both" onclick="toggleCard(this)"><div class="recipe-card-header"><div class="recipe-card-left"><div class="recipe-num">${tx.recipeLabels[idx]||`#${idx+1}`}</div><div class="recipe-name">${r.name}</div><div class="recipe-meta"><span class="badge badge-time">⏱ ${r.time_min} min</span>${diffBadge(r.difficulty)}${r.calories?`<span class="badge badge-cal">🔥 ${r.calories} cal</span>`:''}<button class="share-btn" onclick="event.stopPropagation();shareRecipe(this,${recipes.indexOf(r)})">${tx.shareBtn}</button></div></div><div class="recipe-toggle">▾</div></div><div class="recipe-body"><div class="recipe-body-inner"><div class="body-label">${tx.ingredientsLabel}</div><div class="recipe-ings">${r.ingredients.map(i=>`<span class="recipe-ing-chip">${i}</span>`).join('')}</div><div class="body-label">${tx.stepsLabel}</div><div class="steps-list">${r.steps.map((s,i)=>`<div class="step"><div class="step-num">${i+1}</div><div class="step-text">${s}</div></div>`).join('')}</div><div class="tip-box"><span class="tip-label">💡</span>${r.tip}</div></div></div></div>`).join('');
  const first=document.getElementById('recipeCards').querySelector('.recipe-card');if(first)first.classList.add('open');
}
function toggleCard(c){c.classList.toggle('open')}
function resetAll(){if(isLoading)return;fileInput.value='';const p=document.getElementById('preview');p.style.display='none';p.src='';uploadArea.querySelector('.upload-icon').style.display='block';document.getElementById('t-uploadTitle').style.display='block';document.getElementById('t-uploadSub').style.display='block';uploadArea.classList.remove('has-image');detectBtn.disabled=true;ingredients=[];window._currentRecipes=null;currentSort='none';currentSortDir='asc';hideError();showScreen('screen-upload')}

const savedLang=localStorage.getItem('recipe_lang');if(savedLang&&I18N[savedLang])switchLang(savedLang);else applyI18n();
</script>
</body>
</html>
