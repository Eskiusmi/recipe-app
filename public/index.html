<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Fridgy</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --ink:      #0a0907;
  --ink2:     #111009;
  --ink3:     #1c1914;
  --ink4:     #262320;
  --ink5:     #363230;
  --ink6:     #454240;
  --gold:     #e8b96a;
  --gold2:    #f5cf88;
  --gold3:    #fde4a8;
  --golddim:  rgba(232,185,106,.13);
  --goldbright: rgba(232,185,106,.22);
  --goldfog:  rgba(232,185,106,.05);
  --chalk:    #f2ede6;
  --chalk2:   #d4cec6;
  --chalk3:   #a09a92;
  --chalk4:   #6a6460;
  --chalk5:   #403c38;
  --green:    #7ab88a;
  --greendim: rgba(122,184,138,.15);
  --greenbright: rgba(122,184,138,.25);
  --red:      #c06868;
  --reddim:   rgba(192,104,104,.14);
  --blue:     #6a8ec0;
  --bluedim:  rgba(106,142,192,.14);
  --r:        14px;
  --rsm:      9px;
  --fd: 'Cormorant Garamond', Georgia, serif;
  --fb: 'DM Sans', sans-serif;
  --fm: 'DM Mono', monospace;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body::before {
  content: '';
  position: fixed; inset: 0; z-index: 9999;
  pointer-events: none; opacity: .022;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-size: 200px;
}
body::after {
  content: '';
  position: fixed; top: -20vh; left: 50%; transform: translateX(-50%);
  width: 80vw; height: 80vw; max-width: 550px; max-height: 550px;
  background: radial-gradient(ellipse, rgba(232,185,106,.07) 0%, transparent 70%);
  pointer-events: none; z-index: 0;
}
body {
  font-family: var(--fb);
  background: var(--ink);
  color: var(--chalk);
  min-height: 100vh; min-height: 100dvh;
  display: flex; justify-content: center;
  padding: 0 20px env(safe-area-inset-bottom, 48px);
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
.container { width: 100%; max-width: 430px; position: relative; z-index: 1; }

/* ── Topbar ── */
.topbar { display: flex; justify-content: space-between; align-items: center; padding: 24px 0 0; }
.topbar-right { display: flex; gap: 8px; align-items: center; }
.icon-btn {
  width: 36px; height: 36px; border-radius: 50%;
  background: var(--ink3); border: 1px solid var(--ink5);
  color: var(--chalk3); font-size: 15px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: all .2s;
}
.icon-btn:hover { border-color: var(--gold); color: var(--gold); background: var(--golddim); }
.lang-dropdown { position: relative; }
.lang-trigger {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 14px; border-radius: 999px;
  border: 1px solid var(--ink5); background: var(--ink3);
  color: var(--chalk2); font-size: 12px; font-family: var(--fm);
  letter-spacing: .06em; cursor: pointer; transition: all .2s;
}
.lang-trigger:hover { border-color: var(--gold); color: var(--gold); }
.lang-trigger:disabled { opacity: .35; cursor: not-allowed; }
.lang-arrow { font-size: 9px; transition: transform .2s; }
.lang-dropdown.open .lang-arrow { transform: rotate(180deg); }
.lang-menu {
  position: absolute; top: calc(100% + 8px); right: 0;
  background: var(--ink3); border: 1px solid var(--ink5);
  border-radius: var(--r); padding: 6px; min-width: 150px;
  opacity: 0; visibility: hidden;
  transform: translateY(-6px) scale(.97);
  transition: all .18s cubic-bezier(.4,0,.2,1);
  z-index: 200; box-shadow: 0 20px 60px rgba(0,0,0,.5);
}
.lang-dropdown.open .lang-menu { opacity: 1; visibility: visible; transform: translateY(0) scale(1); }
.lang-option {
  width: 100%; text-align: left; padding: 9px 14px;
  border: none; background: transparent; color: var(--chalk3);
  font-size: 13px; font-family: var(--fb); cursor: pointer;
  border-radius: var(--rsm); transition: all .15s;
  display: flex; align-items: center; justify-content: space-between;
}
.lang-option:hover { background: var(--ink4); color: var(--chalk); }
.lang-option.active { color: var(--gold); }
.lang-option .check { opacity: 0; font-size: 11px; }
.lang-option.active .check { opacity: 1; }

/* ── Header ── */
.header { padding: 44px 0 36px; text-align: center; }
.header-line { width: 0; height: 1px; background: linear-gradient(90deg, transparent, var(--gold), transparent); margin: 0 auto 20px; animation: expandLine .9s .1s ease both; }
.header-eyebrow { font-family: var(--fm); font-size: 10px; letter-spacing: .28em; text-transform: uppercase; color: var(--gold); margin-bottom: 14px; opacity: 0; animation: fadeUp .7s .2s ease both; }
.header h1 { font-family: var(--fd); font-size: 54px; font-weight: 300; letter-spacing: -.03em; line-height: 1; margin-bottom: 12px; opacity: 0; animation: fadeUp .7s .3s ease both; }
.header h1 em { font-style: italic; color: var(--gold2); }
.header p { font-size: 13px; color: var(--chalk3); font-weight: 300; letter-spacing: .02em; opacity: 0; animation: fadeUp .7s .4s ease both; }

/* ── Upload ── */
.upload-zone { margin-bottom: 12px; opacity: 0; animation: fadeUp .7s .5s ease both; }
.upload-area {
  background: var(--ink2); border: 1px solid var(--ink5);
  border-radius: var(--r); padding: 40px 20px; text-align: center;
  cursor: pointer; transition: all .3s; position: relative; overflow: hidden;
}
.upload-area::before {
  content: ''; position: absolute; inset: 0;
  background: radial-gradient(ellipse at 50% 0%, rgba(232,185,106,.06) 0%, transparent 60%);
  opacity: 0; transition: opacity .3s;
}
.upload-area:hover { border-color: var(--gold); transform: translateY(-2px); }
.upload-area:hover::before { opacity: 1; }
.upload-area.has-grid { padding: 12px; border-color: var(--gold); }
.upload-icon-wrap {
  width: 64px; height: 64px; border-radius: 50%;
  background: var(--ink3); border: 1px solid var(--ink5);
  margin: 0 auto 18px;
  display: flex; align-items: center; justify-content: center;
  font-size: 28px; transition: all .3s;
}
.upload-area:hover .upload-icon-wrap { background: var(--golddim); border-color: rgba(232,185,106,.3); }
.upload-title { font-family: var(--fd); font-size: 22px; font-weight: 400; color: var(--chalk2); margin-bottom: 5px; }
.upload-sub { font-size: 11px; font-family: var(--fm); color: var(--chalk4); letter-spacing: .07em; }
.preview-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 6px; }
.preview-thumb { position: relative; aspect-ratio: 1; border-radius: var(--rsm); overflow: hidden; background: var(--ink3); }
.preview-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.preview-thumb-del {
  position: absolute; top: 5px; right: 5px;
  width: 22px; height: 22px; border-radius: 50%;
  background: rgba(10,9,7,.85); border: 1px solid var(--ink5);
  color: var(--chalk2); font-size: 13px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  backdrop-filter: blur(4px); transition: all .15s;
}
.preview-thumb-del:hover { background: var(--reddim); color: var(--red); }
.preview-add-thumb {
  aspect-ratio: 1; border-radius: var(--rsm);
  border: 1px dashed var(--ink5);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; color: var(--chalk4); font-size: 24px;
  transition: all .2s;
}
.preview-add-thumb:hover { border-color: var(--gold); color: var(--gold); }
.preview-count { font-size: 11px; font-family: var(--fm); color: var(--chalk3); text-align: center; padding: 10px 0 4px; letter-spacing: .05em; }
#fileCamera, #fileGallery { display: none; }

/* ── Buttons ── */
.btn {
  width: 100%; padding: 18px;
  background: linear-gradient(135deg, var(--gold) 0%, var(--gold2) 100%);
  color: var(--ink); border: none; border-radius: var(--r);
  font-size: 13px; font-family: var(--fm); font-weight: 500;
  letter-spacing: .14em; text-transform: uppercase;
  cursor: pointer; transition: all .2s;
  box-shadow: 0 4px 20px rgba(232,185,106,.2);
}
.btn:not(:disabled):hover { transform: translateY(-2px); box-shadow: 0 8px 32px rgba(232,185,106,.35); }
.btn:not(:disabled):active { transform: translateY(0); }
.btn:disabled { background: var(--ink4); color: var(--chalk4); cursor: not-allowed; box-shadow: none; }
.btn-ghost {
  width: 100%; padding: 16px;
  background: transparent; color: var(--chalk3);
  border: 1px solid var(--ink5); border-radius: var(--r);
  font-size: 13px; font-family: var(--fm); letter-spacing: .1em;
  text-transform: uppercase; cursor: pointer; transition: all .2s; margin-top: 10px;
}
.btn-ghost:hover { border-color: var(--gold); color: var(--gold); }
.detect-btn-wrap { margin-bottom: 12px; opacity: 0; animation: fadeUp .7s .6s ease both; }
.manual-entry { text-align: center; margin-bottom: 32px; opacity: 0; animation: fadeUp .7s .7s ease both; }
.manual-link {
  font-size: 12px; font-family: var(--fm); color: var(--chalk3);
  letter-spacing: .05em; cursor: pointer; background: none; border: none;
  text-decoration: underline; text-decoration-color: rgba(232,185,106,.3);
  text-underline-offset: 3px; transition: color .2s;
}
.manual-link:hover { color: var(--gold2); }

/* ── Pick menu ── */
.pick-menu { position: fixed; inset: 0; z-index: 300; display: flex; align-items: flex-end; justify-content: center; padding: 0 16px env(safe-area-inset-bottom,20px); }
.pick-backdrop { position: absolute; inset: 0; background: rgba(5,4,3,.78); backdrop-filter: blur(10px); animation: bdin .2s ease both; }
.pick-sheet { position: relative; width: 100%; max-width: 430px; background: var(--ink3); border: 1px solid var(--ink5); border-radius: 22px 22px 18px 18px; padding: 8px 16px 24px; animation: sheetUp .28s cubic-bezier(.32,0,.15,1) both; box-shadow: 0 -24px 60px rgba(0,0,0,.45); }
.pick-handle { width: 36px; height: 4px; background: var(--ink5); border-radius: 999px; margin: 10px auto 20px; }
.pick-title { font-family: var(--fm); font-size: 10px; letter-spacing: .2em; text-transform: uppercase; color: var(--chalk4); text-align: center; margin-bottom: 16px; }
.pick-options { display: flex; flex-direction: column; gap: 8px; }
.pick-option { width: 100%; padding: 16px 18px; background: var(--ink4); border: 1px solid var(--ink5); border-radius: var(--r); color: var(--chalk); font-family: var(--fb); cursor: pointer; display: flex; align-items: center; gap: 14px; transition: all .18s; text-align: left; }
.pick-option:hover { border-color: var(--gold); background: var(--golddim); }
.pick-option-icon { width: 44px; height: 44px; border-radius: 12px; background: var(--ink3); border: 1px solid var(--ink5); display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0; transition: all .18s; }
.pick-option:hover .pick-option-icon { background: var(--golddim); border-color: rgba(232,185,106,.3); }
.pick-option-text { display: flex; flex-direction: column; gap: 3px; }
.pick-option-title { font-size: 15px; font-weight: 500; }
.pick-option-sub { font-size: 12px; color: var(--chalk3); }
.pick-cancel { width: 100%; padding: 15px; margin-top: 8px; background: transparent; border: 1px solid var(--ink5); border-radius: var(--r); color: var(--chalk3); font-size: 12px; font-family: var(--fm); letter-spacing: .1em; text-transform: uppercase; cursor: pointer; transition: all .18s; }
.pick-cancel:hover { border-color: var(--red); color: var(--red); }

/* ── Loading ── */
.loading { display: none; padding: 80px 0 64px; text-align: center; }
.scanner-wrap { position: relative; width: 80px; height: 80px; margin: 0 auto 32px; }
.scanner-svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.scanner-rect { fill: none; stroke: var(--gold); stroke-width: 1.2; stroke-dasharray: 240; stroke-dashoffset: 240; animation: drawRect 1s cubic-bezier(.4,0,.2,1) forwards, rectPulse 2.5s 1s ease-in-out infinite; }
.scan-line { position: absolute; left: 4px; right: 4px; height: 1px; background: linear-gradient(90deg, transparent, var(--gold), transparent); box-shadow: 0 0 8px 1px rgba(232,185,106,.5); animation: scanDown 1.8s .8s ease-in-out infinite; }
.scanner-corner { position: absolute; width: 12px; height: 12px; border-color: var(--gold2); border-style: solid; opacity: 0; animation: cornerIn .4s ease forwards; }
.scanner-corner.tl { top:0;left:0;border-width:1.5px 0 0 1.5px;animation-delay:.9s }
.scanner-corner.tr { top:0;right:0;border-width:1.5px 1.5px 0 0;animation-delay:1s }
.scanner-corner.bl { bottom:0;left:0;border-width:0 0 1.5px 1.5px;animation-delay:1.1s }
.scanner-corner.br { bottom:0;right:0;border-width:0 1.5px 1.5px 0;animation-delay:1.2s }
.sp { position: absolute; width: 4px; height: 4px; border-radius: 50%; background: var(--gold); opacity: 0; }
.sp:nth-child(1) { top:30%;left:25%;animation:particleFloat 2.4s 1.2s ease-in-out infinite }
.sp:nth-child(2) { top:55%;left:60%;animation:particleFloat 2s 1.5s ease-in-out infinite }
.sp:nth-child(3) { top:25%;left:65%;animation:particleFloat 2.8s 1s ease-in-out infinite }
.loading-text { font-family: var(--fd); font-size: 22px; font-weight: 300; font-style: italic; color: var(--chalk2); margin-bottom: 10px; letter-spacing: .02em; min-height: 28px; }
.loading-sub { font-family: var(--fm); font-size: 10px; color: var(--chalk4); letter-spacing: .14em; text-transform: uppercase; }
.loading-bar-wrap { width: 120px; height: 1px; background: var(--ink5); margin: 16px auto 0; overflow: hidden; border-radius: 999px; }
.loading-bar { height: 100%; background: linear-gradient(90deg, var(--gold), var(--gold2)); border-radius: 999px; box-shadow: 0 0 6px rgba(232,185,106,.6); width: 0%; transition: width .4s ease; }

/* ── Error ── */
.error-box { display: none; background: var(--reddim); border: 1px solid rgba(192,104,104,.25); border-radius: var(--r); padding: 16px; margin-top: 12px; animation: fadeUp .25s ease both; }
.error-msg { font-size: 13px; color: #e89090; margin-bottom: 12px; line-height: 1.55; }
.error-actions { display: flex; gap: 8px; }
.error-btn { flex: 1; padding: 10px 12px; border-radius: var(--rsm); font-size: 11px; font-family: var(--fm); letter-spacing: .07em; text-transform: uppercase; cursor: pointer; border: none; }
.error-btn-retry { background: rgba(192,104,104,.2); color: #e89090; }
.error-btn-manual { background: var(--golddim); color: var(--gold2); border: 1px solid rgba(232,185,106,.25) !important; }

/* ── Section label ── */
.section-label {
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 12px;
}
.section-label-text {
  font-family: var(--fm); font-size: 11px;
  letter-spacing: .18em; text-transform: uppercase;
  color: var(--chalk3); white-space: nowrap;
}
.section-label-line { flex: 1; height: 1px; background: var(--ink5); }

/* ── Tags & inputs ── */
.manual-screen { display: none; animation: fadeUp .35s ease both; }
.screen-header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 20px; padding-top: 8px; }
.screen-title { font-family: var(--fd); font-size: 30px; font-weight: 300; letter-spacing: -.01em; }
.screen-hint { font-family: var(--fm); font-size: 11px; color: var(--chalk4); letter-spacing: .07em; }
.tags-wrap { background: var(--ink2); border: 1px solid var(--ink5); border-radius: var(--r); padding: 14px; margin-bottom: 10px; min-height: 70px; }
.tags-list { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 10px; }
.tag {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--golddim); color: var(--gold2);
  border: 1px solid rgba(232,185,106,.28);
  border-radius: 999px; padding: 6px 11px 6px 13px;
  font-size: 13px; font-family: var(--fm); letter-spacing: .03em;
  animation: popIn .2s cubic-bezier(.4,0,.2,1) both;
}
.tag-del { width: 16px; height: 16px; border-radius: 50%; background: rgba(232,185,106,.18); border: none; color: var(--gold); font-size: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background .15s; }
.tag-del:hover { background: rgba(232,185,106,.4); }
.add-row { display: flex; gap: 8px; }
.tag-input { flex: 1; height: 38px; background: var(--ink3); border: 1px solid var(--ink5); border-radius: var(--rsm); color: var(--chalk); font-size: 14px; font-family: var(--fb); padding: 0 13px; outline: none; transition: border-color .2s; }
.tag-input:focus { border-color: var(--gold); }
.tag-input::placeholder { color: var(--chalk4); }
.add-btn { height: 38px; padding: 0 15px; background: var(--golddim); border: 1px solid rgba(232,185,106,.28); border-radius: var(--rsm); color: var(--gold2); font-size: 13px; font-family: var(--fm); letter-spacing: .05em; cursor: pointer; white-space: nowrap; transition: all .15s; }
.add-btn:hover { background: var(--goldbright); }
.tag-count { font-family: var(--fm); font-size: 11px; color: var(--chalk4); letter-spacing: .07em; text-align: right; margin: 8px 0 16px; }
.suggest-label { font-family: var(--fm); font-size: 11px; color: var(--chalk3); letter-spacing: .1em; text-transform: uppercase; margin-bottom: 8px; }
.suggest-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; min-height: 30px; }
.suggest-chip { font-size: 12px; font-family: var(--fm); padding: 5px 12px; border-radius: 999px; background: var(--ink3); color: var(--chalk3); border: 1px dashed var(--ink6); cursor: pointer; transition: all .18s; letter-spacing: .04em; }
.suggest-chip:hover { border-color: var(--gold); color: var(--gold2); background: var(--golddim); }

/* ── Prefs panel (IMPROVED) ── */
.prefs-panel { background: var(--ink2); border: 1px solid var(--ink5); border-radius: var(--r); padding: 20px; margin-bottom: 14px; }
.prefs-section { margin-bottom: 18px; }
.prefs-section:last-child { margin-bottom: 0; }
.prefs-label {
  font-family: var(--fm); font-size: 11px; letter-spacing: .16em;
  text-transform: uppercase; color: var(--chalk3); margin-bottom: 10px;
  display: flex; align-items: center; gap: 8px;
}
.prefs-label::after { content: ''; flex: 1; height: 1px; background: var(--ink5); }
.prefs-row { display: flex; flex-wrap: wrap; gap: 7px; }
.pref-chip {
  font-size: 13px; font-family: var(--fb); font-weight: 400;
  padding: 7px 15px; border-radius: 999px;
  background: var(--ink3); border: 1px solid var(--ink5);
  color: var(--chalk2); cursor: pointer; transition: all .18s;
}
.pref-chip:hover { border-color: var(--chalk3); color: var(--chalk); background: var(--ink4); }
.pref-chip.active {
  background: var(--goldbright); border-color: var(--gold);
  color: var(--gold3); font-weight: 500;
  box-shadow: 0 0 12px rgba(232,185,106,.15);
}

/* ── Condiment modal ── */
.condiment-modal { position: fixed; inset: 0; z-index: 400; display: flex; align-items: flex-end; justify-content: center; padding: 0 0 env(safe-area-inset-bottom,0); }
.condiment-backdrop { position: absolute; inset: 0; background: rgba(5,4,3,.82); backdrop-filter: blur(12px); animation: bdin .2s ease both; }
.condiment-sheet {
  position: relative; width: 100%; max-width: 430px;
  background: var(--ink2); border: 1px solid var(--ink5);
  border-radius: 22px 22px 0 0;
  max-height: 88vh; display: flex; flex-direction: column;
  animation: sheetUp .3s cubic-bezier(.32,0,.15,1) both;
  box-shadow: 0 -24px 80px rgba(0,0,0,.5);
}
.condiment-header { padding: 12px 20px 16px; border-bottom: 1px solid var(--ink5); flex-shrink: 0; }
.condiment-handle { width: 36px; height: 4px; background: var(--ink5); border-radius: 999px; margin: 0 auto 16px; }
.condiment-title { font-family: var(--fd); font-size: 26px; font-weight: 300; margin-bottom: 4px; }
.condiment-title em { font-style: italic; color: var(--gold2); }
.condiment-subtitle { font-size: 12px; color: var(--chalk3); line-height: 1.5; }
.condiment-body { flex: 1; overflow-y: auto; padding: 20px; -webkit-overflow-scrolling: touch; }
.condiment-body::-webkit-scrollbar { width: 3px; }
.condiment-body::-webkit-scrollbar-thumb { background: var(--ink5); border-radius: 999px; }
.condiment-category { margin-bottom: 24px; }
.condiment-category-label {
  font-family: var(--fm); font-size: 10px; letter-spacing: .2em;
  text-transform: uppercase; color: var(--gold); margin-bottom: 12px;
  display: flex; align-items: center; gap: 8px;
}
.condiment-category-label::after { content: ''; flex: 1; height: 1px; background: var(--ink5); }
.condiment-grid { display: flex; flex-wrap: wrap; gap: 8px; }
.cond-chip {
  font-size: 13px; font-family: var(--fb);
  padding: 8px 15px; border-radius: 999px;
  background: var(--ink3); border: 1px solid var(--ink5);
  color: var(--chalk2); cursor: pointer; transition: all .18s;
  display: inline-flex; align-items: center; gap: 6px;
}
.cond-chip:hover { border-color: var(--chalk3); color: var(--chalk); }
.cond-chip.selected {
  background: var(--goldbright); border-color: var(--gold);
  color: var(--gold3); font-weight: 500;
}
.cond-chip .cond-check { font-size: 11px; opacity: 0; transition: opacity .15s; }
.cond-chip.selected .cond-check { opacity: 1; }
.condiment-custom-row { display: flex; gap: 8px; margin-top: 12px; }
.condiment-footer { padding: 16px 20px; border-top: 1px solid var(--ink5); flex-shrink: 0; display: flex; gap: 10px; }
.cond-save-btn {
  flex: 1; padding: 15px;
  background: linear-gradient(135deg, var(--gold), var(--gold2));
  color: var(--ink); border: none; border-radius: var(--rsm);
  font-family: var(--fm); font-size: 12px; font-weight: 500;
  letter-spacing: .12em; text-transform: uppercase; cursor: pointer;
  transition: all .2s; box-shadow: 0 4px 16px rgba(232,185,106,.2);
}
.cond-save-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 24px rgba(232,185,106,.3); }
.cond-cancel-btn { padding: 15px 20px; background: transparent; border: 1px solid var(--ink5); border-radius: var(--rsm); color: var(--chalk3); font-family: var(--fm); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; cursor: pointer; transition: all .18s; }
.cond-cancel-btn:hover { border-color: var(--chalk4); color: var(--chalk2); }
.condiment-count-badge {
  position: absolute; top: -4px; right: -4px;
  width: 16px; height: 16px; border-radius: 50%;
  background: var(--gold); color: var(--ink);
  font-size: 10px; font-family: var(--fm); font-weight: 500;
  display: flex; align-items: center; justify-content: center;
  opacity: 0; transition: opacity .2s;
}
.condiment-count-badge.visible { opacity: 1; }

/* ── Result ── */
.result { display: none; animation: fadeUp .4s ease both; }
.result-header { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 20px; padding-top: 8px; }
.result-title-wrap {}
.result-eyebrow { font-family: var(--fm); font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: var(--gold); margin-bottom: 4px; }
.result-title { font-family: var(--fd); font-size: 30px; font-weight: 300; letter-spacing: -.01em; }
.result-actions { display: flex; gap: 8px; align-items: center; }
.result-count { font-family: var(--fm); font-size: 11px; color: var(--chalk3); background: var(--ink3); padding: 5px 12px; border-radius: 999px; border: 1px solid var(--ink5); }
.history-btn { font-family: var(--fm); font-size: 11px; color: var(--chalk3); background: var(--ink3); padding: 5px 12px; border-radius: 999px; border: 1px solid var(--ink5); cursor: pointer; transition: all .18s; }
.history-btn:hover { border-color: var(--gold); color: var(--gold); }

/* Ingredient bar */
.ing-bar { background: var(--ink2); border: 1px solid var(--ink5); border-radius: var(--r); padding: 18px 20px; margin-bottom: 16px; }
.ing-bar-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.ing-bar-label { font-family: var(--fm); font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--chalk3); }
.ing-bar-hint { font-size: 12px; color: var(--chalk4); }
.result-tags-list { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 10px; }
.result-add-row { display: flex; gap: 8px; margin-bottom: 14px; }
.result-prefs { background: var(--ink2); border: 1px solid var(--ink5); border-radius: var(--r); padding: 18px 20px; margin-bottom: 14px; }
.regen-btn {
  width: 100%; padding: 14px;
  background: linear-gradient(135deg, var(--gold), var(--gold2));
  color: var(--ink); border: none; border-radius: var(--rsm);
  font-family: var(--fm); font-size: 12px; font-weight: 500;
  letter-spacing: .13em; text-transform: uppercase; cursor: pointer;
  transition: all .18s; box-shadow: 0 4px 16px rgba(232,185,106,.18);
}
.regen-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 24px rgba(232,185,106,.28); }

/* ── Sort bar ── */
.sort-bar { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; align-items: center; }
.sort-label { font-family: var(--fm); font-size: 10px; color: var(--chalk4); letter-spacing: .12em; text-transform: uppercase; margin-right: 4px; }
.sort-chip { font-size: 12px; font-family: var(--fm); padding: 6px 13px; border-radius: 999px; background: var(--ink3); border: 1px solid var(--ink5); color: var(--chalk3); cursor: pointer; transition: all .18s; display: inline-flex; align-items: center; gap: 4px; }
.sort-chip:hover { border-color: var(--chalk3); color: var(--chalk2); }
.sort-chip.active { background: var(--golddim); border-color: var(--gold); color: var(--gold2); }
.sort-arrow { font-size: 9px; transition: transform .2s; }
.sort-chip.desc .sort-arrow { transform: rotate(180deg); }

/* ── Recipe cards ── */
.recipe-cards { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }
.recipe-card { background: var(--ink2); border: 1px solid var(--ink5); border-radius: var(--r); overflow: hidden; transition: all .25s; }
.recipe-card:hover { border-color: rgba(232,185,106,.3); transform: translateY(-1px); }
.recipe-card.open { border-color: rgba(232,185,106,.35); }
.recipe-card-header { padding: 20px 20px 16px; cursor: pointer; user-select: none; display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; }
.recipe-card-left { flex: 1; }
.recipe-num { font-family: var(--fm); font-size: 10px; letter-spacing: .22em; text-transform: uppercase; color: var(--gold); margin-bottom: 6px; }
.recipe-name { font-family: var(--fd); font-size: 26px; font-weight: 400; line-height: 1.2; margin-bottom: 12px; }
.recipe-meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.badge { font-family: var(--fm); font-size: 11px; letter-spacing: .05em; padding: 4px 10px; border-radius: 999px; border: 1px solid; font-weight: 400; }
.badge-time  { background: var(--golddim);   color: var(--gold2);  border-color: rgba(232,185,106,.25); }
.badge-easy  { background: var(--greendim);  color: var(--green);  border-color: rgba(122,184,138,.25); }
.badge-medium{ background: var(--bluedim);   color: var(--blue);   border-color: rgba(106,142,192,.25); }
.badge-hard  { background: var(--reddim);    color: var(--red);    border-color: rgba(192,104,104,.25); }
.badge-cal   { background: var(--ink3);      color: var(--chalk3); border-color: var(--ink5); }
.share-btn { font-family: var(--fm); font-size: 11px; padding: 4px 10px; border-radius: 999px; background: var(--ink3); color: var(--chalk4); border: 1px solid var(--ink5); cursor: pointer; transition: all .18s; }
.share-btn:hover { border-color: var(--gold); color: var(--gold); }
.share-btn.copied { background: var(--greendim); color: var(--green); border-color: rgba(122,184,138,.3); }
.recipe-toggle { width: 30px; height: 30px; border-radius: 50%; background: var(--ink3); border: 1px solid var(--ink5); display: flex; align-items: center; justify-content: center; font-size: 12px; color: var(--chalk3); flex-shrink: 0; transition: all .3s cubic-bezier(.4,0,.2,1); margin-top: 2px; }
.recipe-card.open .recipe-toggle { transform: rotate(180deg); background: var(--golddim); border-color: rgba(232,185,106,.3); color: var(--gold); }
.recipe-body { max-height: 0; overflow: hidden; transition: max-height .5s cubic-bezier(.4,0,.2,1); }
.recipe-card.open .recipe-body { max-height: 1400px; }
.recipe-body-inner { padding: 0 20px 22px; border-top: 1px solid var(--ink5); }
.recipe-divider { width: 28px; height: 1px; background: var(--gold); opacity: .35; margin: 18px 0; }
.body-label { font-family: var(--fm); font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: var(--chalk3); margin-bottom: 10px; }
.recipe-ings { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 4px; }
.recipe-ing-chip { font-family: var(--fm); font-size: 11px; padding: 3px 10px; border-radius: 999px; background: var(--ink3); color: var(--chalk3); border: 1px solid var(--ink5); }
.steps-list { display: flex; flex-direction: column; gap: 13px; margin-bottom: 4px; }
.step { display: flex; gap: 14px; align-items: flex-start; }
.step-num { font-family: var(--fm); font-size: 11px; color: var(--gold); flex-shrink: 0; margin-top: 2px; min-width: 20px; letter-spacing: .04em; }
.step-text { font-size: 14px; color: var(--chalk2); line-height: 1.7; font-weight: 300; }
.tip-box { background: var(--goldfog); border: 1px solid rgba(232,185,106,.14); border-radius: var(--rsm); padding: 12px 15px; font-size: 13px; color: var(--chalk3); line-height: 1.6; margin-top: 16px; }
.tip-label { color: var(--gold2); font-weight: 500; margin-right: 5px; font-size: 14px; }

/* ── History ── */
.history-panel { display: none; animation: fadeUp .35s ease both; }
.history-panel-header { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 20px; padding-top: 8px; }
.history-panel-title { font-family: var(--fd); font-size: 30px; font-weight: 300; }
.history-clear { font-family: var(--fm); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--chalk4); background: none; border: none; cursor: pointer; padding: 4px 8px; transition: color .15s; }
.history-clear:hover { color: var(--red); }
.history-empty { text-align: center; padding: 48px 0; font-family: var(--fd); font-size: 20px; font-style: italic; color: var(--chalk4); }
.history-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
.history-item { background: var(--ink2); border: 1px solid var(--ink5); border-radius: var(--r); padding: 14px 16px; cursor: pointer; transition: all .2s; }
.history-item:hover { border-color: rgba(232,185,106,.28); transform: translateY(-1px); }
.history-item-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.history-item-time { font-family: var(--fm); font-size: 10px; color: var(--chalk4); }
.history-item-meta { display: flex; gap: 6px; }
.history-item-lang { font-family: var(--fm); font-size: 10px; color: var(--gold); background: var(--golddim); padding: 2px 9px; border-radius: 999px; }
.history-item-count { font-family: var(--fm); font-size: 10px; color: var(--chalk4); background: var(--ink3); padding: 2px 9px; border-radius: 999px; }
.history-item-ings { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 8px; }
.history-ing { font-family: var(--fm); font-size: 11px; padding: 3px 9px; border-radius: 999px; background: var(--golddim); color: var(--gold2); border: 1px solid rgba(232,185,106,.18); }
.history-item-recipes { font-size: 13px; color: var(--chalk3); line-height: 1.5; font-weight: 300; }

/* ── Onboarding modal ── */
.onboard-modal {
  position: fixed; inset: 0; z-index: 500;
  display: flex; align-items: center; justify-content: center;
  padding: 24px;
}
.onboard-backdrop {
  position: absolute; inset: 0;
  background: rgba(5,4,3,.88);
  backdrop-filter: blur(16px);
  animation: bdin .3s ease both;
}
.onboard-card {
  position: relative;
  width: 100%; max-width: 360px;
  background: var(--ink3);
  border: 1px solid var(--ink5);
  border-radius: 22px;
  padding: 32px 28px 28px;
  animation: onboardIn .4s cubic-bezier(.34,1.4,.64,1) both;
  box-shadow: 0 32px 80px rgba(0,0,0,.6), 0 0 0 1px rgba(232,185,106,.08);
}
.onboard-logo {
  font-family: var(--fd);
  font-size: 32px;
  font-weight: 300;
  text-align: center;
  margin-bottom: 4px;
  letter-spacing: -.02em;
}
.onboard-logo em { font-style: italic; color: var(--gold2); }
.onboard-tagline {
  font-family: var(--fm);
  font-size: 10px;
  letter-spacing: .2em;
  text-transform: uppercase;
  color: var(--chalk4);
  text-align: center;
  margin-bottom: 28px;
}
.onboard-divider {
  width: 100%; height: 1px;
  background: linear-gradient(90deg, transparent, var(--ink5), transparent);
  margin-bottom: 24px;
}
.onboard-steps { display: flex; flex-direction: column; gap: 18px; margin-bottom: 28px; }
.onboard-step { display: flex; align-items: flex-start; gap: 14px; }
.onboard-step-icon {
  width: 40px; height: 40px; border-radius: 12px;
  background: var(--ink4); border: 1px solid var(--ink5);
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; flex-shrink: 0;
  transition: all .2s;
}
.onboard-step-text { padding-top: 2px; }
.onboard-step-title {
  font-size: 14px; font-weight: 500;
  color: var(--chalk); margin-bottom: 3px;
}
.onboard-step-desc {
  font-size: 12px; color: var(--chalk3);
  line-height: 1.55; font-weight: 300;
}
.onboard-start-btn {
  width: 100%; padding: 16px;
  background: linear-gradient(135deg, var(--gold), var(--gold2));
  color: var(--ink); border: none; border-radius: var(--rsm);
  font-family: var(--fm); font-size: 12px; font-weight: 500;
  letter-spacing: .14em; text-transform: uppercase;
  cursor: pointer; transition: all .2s;
  box-shadow: 0 4px 20px rgba(232,185,106,.25);
}
.onboard-start-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(232,185,106,.35); }
.onboard-skip {
  display: block; text-align: center;
  font-family: var(--fm); font-size: 10px;
  color: var(--chalk5); letter-spacing: .1em;
  margin-top: 14px; cursor: pointer;
  transition: color .2s; background: none; border: none;
  width: 100%;
}
.onboard-skip:hover { color: var(--chalk4); }
/* Step highlight animation — stagger in */
.onboard-step:nth-child(1) { animation: fadeUp .4s .15s ease both; opacity: 0; }
.onboard-step:nth-child(2) { animation: fadeUp .4s .25s ease both; opacity: 0; }
.onboard-step:nth-child(3) { animation: fadeUp .4s .35s ease both; opacity: 0; }
.onboard-step:nth-child(4) { animation: fadeUp .4s .45s ease both; opacity: 0; }
/* ── Video preview drawer ── */
.video-drawer {
  position: fixed; inset: 0; z-index: 500;
  display: flex; align-items: flex-end; justify-content: center;
  padding: 0;
}
.video-drawer-backdrop {
  position: absolute; inset: 0;
  background: rgba(5,4,3,.82);
  backdrop-filter: blur(12px);
  animation: bdin .2s ease both;
}
.video-drawer-sheet {
  position: relative;
  width: 100%; max-width: 430px;
  height: 82vh;
  background: var(--ink2);
  border: 1px solid var(--ink5);
  border-radius: 22px 22px 0 0;
  display: flex; flex-direction: column;
  animation: sheetUp .28s cubic-bezier(.32,0,.15,1) both;
  box-shadow: 0 -24px 80px rgba(0,0,0,.5);
  overflow: hidden;
}
.video-drawer-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 18px 12px;
  border-bottom: 1px solid var(--ink5);
  flex-shrink: 0;
}
.video-drawer-handle {
  position: absolute; top: 8px; left: 50%;
  transform: translateX(-50%);
  width: 36px; height: 4px;
  background: var(--ink5); border-radius: 999px;
}
.video-drawer-title {
  font-family: var(--fd); font-size: 18px; font-weight: 300;
  padding-top: 8px;
}
.video-drawer-title em { font-style: italic; color: var(--gold2); }
.video-drawer-tabs {
  display: flex; gap: 6px; padding-top: 8px;
}
.video-drawer-tab {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 11px; font-family: var(--fm); letter-spacing: .05em;
  padding: 5px 12px; border-radius: 999px;
  border: 1px solid var(--ink5); background: var(--ink3);
  color: var(--chalk3); cursor: pointer; transition: all .18s;
}
.video-drawer-tab.active-bili { border-color: #4fc3f7; color: #4fc3f7; background: rgba(79,195,247,.1); }
.video-drawer-tab.active-yt   { border-color: #ff5555; color: #ff6666; background: rgba(255,85,85,.1); }
.video-drawer-tab.active-xhs  { border-color: #ff2442; color: #ff4060; background: rgba(255,36,66,.1); }
.video-drawer-close {
  width: 30px; height: 30px; border-radius: 50%;
  background: var(--ink4); border: 1px solid var(--ink5);
  color: var(--chalk3); font-size: 16px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; transition: all .18s; padding-top: 8px;
}
.video-drawer-close:hover { border-color: var(--red); color: var(--red); }
.video-drawer-body {
  flex: 1; position: relative; overflow: hidden;
}
.video-drawer-body iframe {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  border: none;
}
.video-drawer-loading {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 12px; color: var(--chalk3);
  font-family: var(--fm); font-size: 11px; letter-spacing: .1em;
}
.video-drawer-loading-ring {
  width: 32px; height: 32px; border-radius: 50%;
  border: 1px solid var(--ink5);
  border-top-color: var(--gold);
  animation: spin 1s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

@keyframes onboardIn {
  from { opacity: 0; transform: scale(.9) translateY(20px); }
  to   { opacity: 1; transform: scale(1) translateY(0); }
}
@keyframes fadeUp     { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }
@keyframes expandLine { from{width:0;opacity:0} to{width:100%;opacity:1} }
@keyframes popIn      { from{opacity:0;transform:scale(.65)} to{opacity:1;transform:scale(1)} }
@keyframes bdin       { from{opacity:0} to{opacity:1} }
@keyframes sheetUp    { from{transform:translateY(100%)} to{transform:translateY(0)} }
@keyframes drawRect   { to{stroke-dashoffset:0} }
@keyframes rectPulse  { 0%,100%{opacity:1} 50%{opacity:.35} }
@keyframes scanDown   { 0%{top:4px;opacity:0} 8%{opacity:1} 92%{opacity:1} 100%{top:74px;opacity:0} }
@keyframes cornerIn   { from{opacity:0;transform:scale(.4)} to{opacity:1;transform:scale(1)} }
@keyframes particleFloat { 0%,100%{opacity:0;transform:translateY(0) scale(1)} 20%,80%{opacity:.7} 50%{opacity:1;transform:translateY(-9px) scale(1.4)} }
</style>

<body class="lang-zh">
<div class="container">

  <!-- Topbar -->
  <div class="topbar">
    <div style="position:relative">
      <button class="icon-btn" id="condimentBtn" onclick="openCondiments()" title="调料设置">⚗</button>
      <div class="condiment-count-badge" id="condimentBadge">0</div>
    </div>
    <div class="topbar-right">
      <div class="lang-dropdown" id="langDropdown">
        <button class="lang-trigger" id="langTrigger" onclick="toggleLangDropdown(event)">
          <span id="langCurrentLabel">中文</span>
          <span class="lang-arrow">▾</span>
        </button>
        <div class="lang-menu">
          <button class="lang-option active" data-lang="zh" onclick="switchLang('zh')"><span>中文</span><span class="check">✓</span></button>
          <button class="lang-option" data-lang="en" onclick="switchLang('en')"><span>English</span><span class="check">✓</span></button>
          <button class="lang-option" data-lang="fr" onclick="switchLang('fr')"><span>Français</span><span class="check">✓</span></button>
          <button class="lang-option" data-lang="es" onclick="switchLang('es')"><span>Español</span><span class="check">✓</span></button>
        </div>
      </div>
    </div>
  </div>

  <!-- Header -->
  <div class="header">
    <div class="header-line"></div>
    <div class="header-eyebrow" id="t-eyebrow">AI 菜谱助手</div>
    <h1 id="t-title">今天<em>吃什么</em></h1>
    <p id="t-subtitle">拍下冰箱里的食材，AI 帮你决定</p>
  </div>

  <!-- Upload -->
  <div id="screen-upload">
    <div class="upload-zone">
      <div class="upload-area" id="uploadArea" onclick="openPickMenu()">
        <div id="uploadDefault">
          <div class="upload-icon-wrap">📷</div>
          <div class="upload-title" id="t-uploadTitle">拍照或从图库选择</div>
          <div class="upload-sub" id="t-uploadSub">JPG · PNG · WEBP · 最多5张</div>
        </div>
        <div class="preview-grid" id="previewGrid" style="display:none"></div>
      </div>
      <div class="preview-count" id="previewCount" style="display:none"></div>
    </div>
    <input type="file" id="fileCamera" accept="image/*" capture="environment">
    <input type="file" id="fileGallery" accept="image/*" multiple>
    <div class="detect-btn-wrap">
      <button class="btn" id="detectBtn" disabled onclick="runFromPhoto()"><span id="t-detectBtn">识别食材</span></button>
    </div>
    <div class="manual-entry">
      <button class="manual-link" onclick="goManual()" id="t-manualLink">不想拍照？直接输入食材 →</button>
    </div>
  </div>

  <!-- Pick menu -->
  <div class="pick-menu" id="pickMenu" style="display:none" onclick="closePickMenu(event)">
    <div class="pick-backdrop"></div>
    <div class="pick-sheet">
      <div class="pick-handle"></div>
      <div class="pick-title" id="t-pickTitle">选择方式</div>
      <div class="pick-options">
        <button class="pick-option" onclick="triggerCamera()">
          <div class="pick-option-icon">📷</div>
          <div class="pick-option-text"><span class="pick-option-title" id="t-pickCamera">拍照</span><span class="pick-option-sub" id="t-pickCameraSub">直接用相机拍食材</span></div>
        </button>
        <button class="pick-option" onclick="triggerGallery()">
          <div class="pick-option-icon">🖼️</div>
          <div class="pick-option-text"><span class="pick-option-title" id="t-pickGallery">从图库选择</span><span class="pick-option-sub" id="t-pickGallerySub">可同时选多张图片</span></div>
        </button>
      </div>
      <button class="pick-cancel" onclick="closePickMenu()" id="t-pickCancel">取消</button>
    </div>
  </div>

  <!-- Loading -->
  <div class="loading" id="loading">
    <div class="scanner-wrap">
      <svg class="scanner-svg" viewBox="0 0 80 80">
        <rect class="scanner-rect" x="2" y="2" width="76" height="76" rx="4"/>

// ── Synonyms ──
const SYNONYMS = { '番茄':['西红柿'], '土豆':['马铃薯','洋芋'], tomato:['tomatoes'], potato:['potatoes'], egg:['eggs'], onion:['onions','scallion'] };
function isSemanticDuplicate(a, b) {
  const l = a.toLowerCase();
  for (const x of b) {
    const xl = x.toLowerCase();
    if (xl === l) return true;
    for (const [k, s] of Object.entries(SYNONYMS)) {
      const all = [k.toLowerCase(), ...s.map(v => v.toLowerCase())];
      if (all.includes(l) && all.includes(xl)) return true;
    }
  }
  return false;
}

// ── EXIF fix ──
async function fixImageOrientation(file) {
  return new Promise(r => {
    const img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas'), ctx = c.getContext('2d'), mx = 1600;
      let { width: w, height: h } = img;
      if (w > mx || h > mx) { const ra = Math.min(mx/w, mx/h); w *= ra; h *= ra; }
      c.width = w; c.height = h; ctx.drawImage(img, 0, 0, w, h);
      c.toBlob(b => r(b || file), 'image/jpeg', .85);
    };
    img.onerror = () => r(file);
    img.src = URL.createObjectURL(file);
  });
}

// ── Loading ──
function typewrite(el, text, speed=38) {
  el.textContent = '';
  let i = 0;
  const tick = () => { if (i < text.length) { el.textContent += text[i++]; setTimeout(tick, speed); } };
  tick();
}
let barTimer = null;
function animateBar() {
  const bar = document.getElementById('loadingBar');
  if (!bar) return;
  bar.style.transition = 'none'; bar.style.width = '0%';
  barTimer = [];
  [[400,35],[2000,55],[4500,70],[7500,82],[11000,90]].forEach(([d,w]) => {
    barTimer.push(setTimeout(() => { bar.style.transition = 'width .8s ease'; bar.style.width = w + '%'; }, d));
  });
}
function showLoading(txt, sub) {
  const el = document.getElementById('loadingText');
  typewrite(el, txt);
  document.getElementById('loadingSub').textContent = sub;
  const wrap = document.querySelector('.scanner-wrap');
  if (wrap) { const clone = wrap.cloneNode(true); wrap.parentNode.replaceChild(clone, wrap); }
  document.getElementById('loading').style.display = 'block';
  isLoading = true;
  document.getElementById('langTrigger').disabled = true;
  document.getElementById('langDropdown').classList.remove('open');
  animateBar();
}
function hideLoading() {
  document.getElementById('loading').style.display = 'none';
  if (tipTimer) { clearInterval(tipTimer); tipTimer = null; }
  if (barTimer) { barTimer.forEach(clearTimeout); barTimer = null; }
  isLoading = false;
  document.getElementById('langTrigger').disabled = false;
}
function startTips() {
  if (tipTimer) clearInterval(tipTimer);
  const tips = t().loadingTips;
  let i = 0;
  tipTimer = setInterval(() => {
    i = (i + 1) % tips.length;
    const el = document.getElementById('loadingText');
    el.style.opacity = '0'; el.style.transition = 'opacity .25s';
    setTimeout(() => { el.style.transition = ''; el.style.opacity = '1'; typewrite(el, tips[i], 30); }, 260);
  }, 3500);
}

// ── Suggestions ──
let suggestTimer = null;
async function fetchSuggestions() {
  if (!ingredients.length) { document.getElementById('suggestionsRow').innerHTML = ''; document.getElementById('t-suggestLabel').style.display = 'none'; return; }
  clearTimeout(suggestTimer);
  suggestTimer = setTimeout(async () => {
    const tx = t();
    document.getElementById('t-suggestLabel').style.display = 'block';
    document.getElementById('t-suggestLabel').textContent = tx.suggestLoading;
    try {
      const res = await fetch(`${API_BASE}/suggest`, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ ingredients, lang: currentLang }) });
      const data = await res.json();
      if (data.success && data.suggestions.length > 0) {
        document.getElementById('t-suggestLabel').textContent = tx.suggestLabel;
        document.getElementById('suggestionsRow').innerHTML = data.suggestions.map(s => `<button class="suggest-chip" onclick="addSuggestion('${s.replace(/'/g,"\\'")}') ">${s}</button>`).join('');
      } else { document.getElementById('t-suggestLabel').style.display = 'none'; document.getElementById('suggestionsRow').innerHTML = ''; }
    } catch { document.getElementById('t-suggestLabel').style.display = 'none'; }
  }, 800);
}
function addSuggestion(s) { if (isSemanticDuplicate(s, ingredients)) return; ingredients.push(s); renderEditTags(); fetchSuggestions(); }

function shareRecipe(btn, idx) {
  const r = (window._currentRecipes || [])[idx]; if (!r) return;
  const tx = t(), text = `【${r.name}】 ${r.time_min}min · ${r.difficulty} · ${r.calories}cal\n\n${tx.ingredientsLabel}: ${r.ingredients.join(', ')}\n\n${tx.stepsLabel}:\n${r.steps.map((s,i) => `${i+1}. ${s}`).join('\n')}\n\n💡 ${r.tip}`;
  const fin = () => { btn.textContent = tx.shareCopied; btn.classList.add('copied'); setTimeout(() => { btn.textContent = tx.shareBtn; btn.classList.remove('copied'); }, 2000); };
  if (navigator.clipboard) navigator.clipboard.writeText(text).then(fin).catch(() => fallbackCopy(text, fin));
  else fallbackCopy(text, fin);
}
function fallbackCopy(text, cb) { const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); cb(); }

// ── History ──
function loadHistory() { try { return JSON.parse(localStorage.getItem(HISTORY_KEY)) || []; } catch { return []; } }
function saveToHistory(data) {
  let h = loadHistory();
  h.unshift({ id: Date.now(), time: new Date().toLocaleString(), lang: currentLang, ingredients: data.ingredients, recipes: data.recipes.map(r => ({ name:r.name, time_min:r.time_min, difficulty:r.difficulty, calories:r.calories, ingredients:r.ingredients, steps:r.steps, tip:r.tip })) });
  while (h.length > 0) {
    try {
      const sl = h.slice(0, MAX_HISTORY), sr = JSON.stringify(sl);
      if (sr.length > 3*1024*1024) { h = h.slice(0, Math.max(1, h.length-1)); continue; }
      localStorage.setItem(HISTORY_KEY, sr); break;
    } catch { if (h.length <= 1) { localStorage.removeItem(HISTORY_KEY); break; } h = h.slice(0, h.length-1); }
  }
}
function clearHistory() { if (!confirm(t().confirmClear)) return; localStorage.removeItem(HISTORY_KEY); renderHistoryList(); }
function showHistory() { if (isLoading) return; prevScreen = window._currentRecipes ? 'screen-result' : 'screen-upload'; renderHistoryList(); showScreen('screen-history'); }
function backFromHistory() { showScreen(prevScreen); }
function renderHistoryList() {
  const h = loadHistory(), tx = t(), el = document.getElementById('historyList');
  if (!h.length) { el.innerHTML = `<div class="history-empty">${tx.historyEmpty}</div>`; return; }
  el.innerHTML = '<div class="history-list">' + h.map(r => `<div class="history-item" onclick="loadHistoryRecord(${r.id})"><div class="history-item-top"><div class="history-item-time">${r.time}</div><div class="history-item-meta"><div class="history-item-lang">${(r.lang||'zh').toUpperCase()}</div><div class="history-item-count">${tx.recipesCount(r.recipes.length)}</div></div></div><div class="history-item-ings">${r.ingredients.map(i => `<span class="history-ing">${i}</span>`).join('')}</div><div class="history-item-recipes">${r.recipes.map(x => x.name).join(' · ')}</div></div>`).join('') + '</div>';
}
function loadHistoryRecord(id) {
  const r = loadHistory().find(x => x.id === id); if (!r) return;
  ingredients = [...r.ingredients];
  if (r.lang && r.lang !== currentLang) switchLang(r.lang);
  renderResult({ ingredients: r.ingredients, recipes: r.recipes }, false);
  showScreen('screen-result');

// ── Sort ──
const DIFF_ORDER = { zh:{'简单':1,'中等':2,'较难':3}, en:{'Easy':1,'Medium':2,'Hard':3}, fr:{'Facile':1,'Moyen':2,'Difficile':3}, es:{'Fácil':1,'Medio':2,'Difícil':3} };
function getDiffNum(d) { return (DIFF_ORDER[currentLang] || DIFF_ORDER.zh)[d] || 2; }
function sortRecipes(recipes, sortBy, dir) {
  const s = [...recipes];
  if (sortBy === 'time') s.sort((a,b) => dir==='asc' ? (a.time_min||0)-(b.time_min||0) : (b.time_min||0)-(a.time_min||0));
  else if (sortBy === 'difficulty') s.sort((a,b) => dir==='asc' ? getDiffNum(a.difficulty)-getDiffNum(b.difficulty) : getDiffNum(b.difficulty)-getDiffNum(a.difficulty));
  else if (sortBy === 'calories') s.sort((a,b) => dir==='asc' ? (a.calories||0)-(b.calories||0) : (b.calories||0)-(a.calories||0));
  return s;
}
function toggleSort(sortBy) {
  if (currentSort === sortBy) { if (currentSortDir === 'asc') currentSortDir = 'desc'; else { currentSort = 'none'; currentSortDir = 'asc'; } }
  else { currentSort = sortBy; currentSortDir = 'asc'; }
  renderSortBar();
  if (window._currentRecipes) renderRecipeCards(window._currentRecipes);
}
function renderSortBar() {
  const tx = t();
  const sorts = [{k:'time',l:tx.sortTime},{k:'difficulty',l:tx.sortDifficulty},{k:'calories',l:tx.sortCalories}];
  document.getElementById('sortBar').innerHTML = `<span class="sort-label">${tx.sortLabel}</span>` + sorts.map(s => `<button class="sort-chip${currentSort===s.k?' active':''}${currentSort===s.k&&currentSortDir==='desc'?' desc':''}" onclick="toggleSort('${s.k}')">${s.l}<span class="sort-arrow">${currentSort===s.k?'↑':'·'}</span></button>`).join('');
}

// ── API calls (condiments injected into requests) ──
async function runFromPhoto() {
  if (isLoading || !selectedFiles.length) return;
  document.getElementById('detectBtn').disabled = true; hideError(); showScreen(null);
  const tx = t(); showLoading(tx.loadingPhoto, tx.loadingPhotoSub); startTips();
  const reqId = ++currentRequestId;
  try {
    const fd = new FormData();
    for (let i = 0; i < selectedFiles.length; i++) { const f = await fixImageOrientation(selectedFiles[i]); fd.append('images', f, `photo${i}.jpg`); }
    fd.append('lang', currentLang); fd.append('servings', selectedServings);
    fd.append('dietary', JSON.stringify(selectedDietary)); fd.append('style', selectedStyle);
    fd.append('condiments', JSON.stringify(userCondiments)); // ← 传调料
    const res = await fetch(`${API_BASE}/detect-and-generate`, { method:'POST', body: fd });
    if (reqId !== currentRequestId) return;
    if (res.status === 429) { const d = await res.json(); throw { type:'rate_limit', resetIn: d.resetIn }; }
    if (!res.ok) throw { type:'network' };
    const data = await res.json(); if (!data.success) throw { type:'api', msg: data.error };
    ingredients = [...data.data.ingredients];

    // 第一次生成前引导设置调料
    if (!localStorage.getItem(CONDIMENTS_SETUP_KEY)) {
      hideLoading();
      openCondimentsForSetup();
      // 保存后自动触发生成（改 saveCondimentsAndGenerate 直接调 generateRecipes）
      return;
    }

    renderResult(data.data, true); showScreen('screen-result');
  } catch (err) {
    if (reqId !== currentRequestId) return;
    showScreen('screen-upload'); document.getElementById('detectBtn').disabled = false; handleError(err, 'runFromPhoto()');
  } finally { if (reqId === currentRequestId) hideLoading(); }
}

const CONDIMENTS_SETUP_KEY = 'fridgy_condiments_setup';

async function generateRecipes() {
  if (isLoading || !ingredients.length) { if (!ingredients.length) showError(t().errEmpty, []); return; }

  // 第一次生成前强制引导设置调料
  if (!localStorage.getItem(CONDIMENTS_SETUP_KEY)) {
    openCondimentsForSetup();
    return;
  }

  hideError(); showScreen(null); const tx = t(); showLoading(tx.loadingGenerate, tx.loadingGenerateSub); startTips();
  const reqId = ++currentRequestId;
  try {
    const res = await fetch(`${API_BASE}/generate`, {
      method: 'POST', headers: { 'Content-Type':'application/json' },
      body: JSON.stringify({ ingredients, lang: currentLang, servings: selectedServings, dietary: selectedDietary, style: selectedStyle, condiments: userCondiments })
    });
    if (reqId !== currentRequestId) return;
    if (res.status === 429) { const d = await res.json(); throw { type:'rate_limit', resetIn: d.resetIn }; }
    if (!res.ok) throw { type:'network' };
    const data = await res.json(); if (!data.success) throw { type:'api' };
    renderResult(data.data, true); showScreen('screen-result');
  } catch (err) {
    if (reqId !== currentRequestId) return;
    showScreen(window._currentRecipes ? 'screen-result' : 'screen-manual');
    showError(err.type === 'network' ? tx.errNetwork : tx.errGenerate, [{ label: tx.errRetry, cls:'error-btn-retry', fn:'generateRecipes()' }]);
  } finally { if (reqId === currentRequestId) hideLoading(); }
}

function handleError(err, retryFn) {
  const tx = t();
  if (err.type === 'rate_limit') {
    const mins = err.resetIn || 60;
    const msg = {
      zh: `今日使用次数已达上限，${mins} 分钟后重置`,
      en: `Daily limit reached. Resets in ${mins} minutes`,
      fr: `Limite quotidienne atteinte. Réinitialisation dans ${mins} minutes`,
      es: `Límite diario alcanzado. Se restablece en ${mins} minutos`
    }[currentLang] || `Rate limit reached. Resets in ${mins} minutes`;
    showError(msg, []);
    return;
  }
  if (err.type === 'network') showError(tx.errNetwork, [{ label:tx.errRetry, cls:'error-btn-retry', fn:retryFn }, { label:tx.errManual, cls:'error-btn-manual', fn:'goManual()' }]);
  else if (err.msg === 'no_ingredients') showError(tx.errNoIngredients, [{ label:tx.errRetake, cls:'error-btn-retry', fn:retryFn }, { label:tx.errManual, cls:'error-btn-manual', fn:'goManual()' }]);
  else showError(tx.errDetect, [{ label:tx.errRetry, cls:'error-btn-retry', fn:retryFn }, { label:tx.errManual, cls:'error-btn-manual', fn:'goManual()' }]);
}

function diffBadge(d) {
  const e=['简单','Easy','Facile','Fácil'], h=['较难','Hard','Difficile','Difícil'];
  if (e.includes(d)) return `<span class="badge badge-easy">${d}</span>`;
  if (h.includes(d)) return `<span class="badge badge-hard">${d}</span>`;
  return `<span class="badge badge-medium">${d}</span>`;
}

function renderResult(data, save=true) {
  ingredients = [...data.ingredients]; window._currentRecipes = data.recipes;
  if (save) saveToHistory(data);
  renderResultTags(); renderAllPrefs(); renderSortBar();
  document.getElementById('resultCount').textContent = t().recipesCount(data.recipes.length);
  renderRecipeCards(data.recipes);
}

function renderRecipeCards(recipes) {

  document.getElementById('recipeCards').innerHTML = sorted.map((r, idx) => `
    <div class="recipe-card" style="animation:fadeUp .45s ${idx*.1}s ease both" onclick="toggleCard(this)">
      <div class="recipe-card-header">
        <div class="recipe-card-left">
          <div class="recipe-num">${tx.recipeLabels[idx] || `#${idx+1}`}</div>
          <div class="recipe-name">${r.name}</div>
          <div class="recipe-meta">
            <span class="badge badge-time">⏱ ${r.time_min} min</span>
            ${diffBadge(r.difficulty)}
            ${r.calories ? `<span class="badge badge-cal">🔥 ${r.calories}</span>` : ''}
            <button class="share-btn" onclick="event.stopPropagation();shareRecipe(this,${recipes.indexOf(r)})">${tx.shareBtn}</button>
          </div>
        </div>
        <div class="recipe-toggle">▾</div>
      </div>
      <div class="recipe-body">
        <div class="recipe-body-inner">
          <div class="recipe-divider"></div>
          <div class="body-label">${tx.ingredientsLabel}</div>
          <div class="recipe-ings">${r.ingredients.map(i => `<span class="recipe-ing-chip">${i}</span>`).join('')}</div>
          <div class="recipe-divider"></div>
          <div class="body-label">${tx.stepsLabel}</div>
          <div class="steps-list">${r.steps.map((s,i) => `<div class="step"><div class="step-num">0${i+1}</div><div class="step-text">${s}</div></div>`).join('')}</div>
          <div class="tip-box"><span class="tip-label">💡</span>${r.tip}</div>
          ${buildVideoLinks(r, currentLang)}
        </div>
      </div>
    </div>`).join('');
  const first = document.getElementById('recipeCards').querySelector('.recipe-card');
  if (first) first.classList.add('open');
}

function toggleCard(c) { c.classList.toggle('open'); }

function resetAll() {
