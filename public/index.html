<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Fridgy</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --ink:     #0a0907;
  --ink2:    #111009;
  --ink3:    #1a1814;
  --ink4:    #252220;
  --ink5:    #302d29;
  --gold:    #c9a96e;
  --gold2:   #e8c88a;
  --gold3:   #f5dfa0;
  --golddim: rgba(201,169,110,.10);
  --goldfog: rgba(201,169,110,.04);
  --chalk:   #f0ece4;
  --chalk2:  #c8c2b8;
  --chalk3:  #8a847a;
  --chalk4:  #504b45;
  --chalk5:  #302d29;
  --green:   #6b9e7a;
  --greendim:rgba(107,158,122,.12);
  --red:     #b05555;
  --reddim:  rgba(176,85,85,.12);
  --blue:    #5a7aaa;
  --bluedim: rgba(90,122,170,.12);
  --r:       14px;
  --rsm:     8px;
  --fd:      'Cormorant Garamond', Georgia, serif;
  --fb:      'DM Sans', sans-serif;
  --fm:      'DM Mono', monospace;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

/* ── Noise texture overlay ── */
body::before {
  content: '';
  position: fixed; inset: 0; z-index: 9999;
  pointer-events: none;
  opacity: .025;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-size: 200px;
}

body {
  font-family: var(--fb);
  background: var(--ink);
  color: var(--chalk);
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  justify-content: center;
  padding: 0 20px env(safe-area-inset-bottom, 40px);
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

/* Radial ambient glow */
body::after {
  content: '';
  position: fixed;
  top: -30vh; left: 50%;
  transform: translateX(-50%);
  width: 80vw; height: 80vw;
  max-width: 600px; max-height: 600px;
  background: radial-gradient(ellipse, rgba(201,169,110,.06) 0%, transparent 70%);
  pointer-events: none;
  z-index: 0;
}

.container {
  width: 100%;
  max-width: 430px;
  position: relative;
  z-index: 1;
}

/* ── Language dropdown ── */
.topbar {
  display: flex;
  justify-content: flex-end;
  align-items: center;
  padding: 24px 0 0;
  position: relative;
}
.lang-dropdown { position: relative; }
.lang-trigger {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 14px;
  border-radius: 999px;
  border: 1px solid var(--ink5);
  background: var(--ink2);
  color: var(--chalk3);
  font-size: 11px;
  font-family: var(--fm);
  letter-spacing: .08em;
  cursor: pointer;
  transition: border-color .2s, color .2s;
}
.lang-trigger:hover { border-color: var(--gold); color: var(--gold); }
.lang-trigger:disabled { opacity: .35; cursor: not-allowed; }
.lang-trigger:disabled:hover { border-color: var(--ink5); color: var(--chalk3); }
.lang-arrow { font-size: 9px; transition: transform .2s; }
.lang-dropdown.open .lang-arrow { transform: rotate(180deg); }
.lang-menu {
  position: absolute; top: calc(100% + 8px); right: 0;
  background: var(--ink3);
  border: 1px solid var(--ink5);
  border-radius: var(--r);
  padding: 6px;
  min-width: 150px;
  opacity: 0; visibility: hidden;
  transform: translateY(-6px) scale(.97);
  transition: all .18s cubic-bezier(.4,0,.2,1);
  z-index: 200;
  box-shadow: 0 20px 60px rgba(0,0,0,.5);
}
.lang-dropdown.open .lang-menu { opacity: 1; visibility: visible; transform: translateY(0) scale(1); }
.lang-option {
  width: 100%; text-align: left;
  padding: 9px 14px;
  border: none; background: transparent;
  color: var(--chalk3);
  font-size: 12px; font-family: var(--fm); letter-spacing: .05em;
  cursor: pointer; border-radius: var(--rsm);
  transition: background .15s, color .15s;
  display: flex; align-items: center; justify-content: space-between;
}
.lang-option:hover { background: var(--ink4); color: var(--chalk); }
.lang-option.active { color: var(--gold); }
.lang-option .check { opacity: 0; font-size: 11px; }
.lang-option.active .check { opacity: 1; }

/* ── Header ── */
.header {
  padding: 44px 0 36px;
  text-align: center;
  position: relative;
}
.header-line {
  width: 40px; height: 1px;
  background: var(--gold);
  margin: 0 auto 20px;
  opacity: .6;
  animation: expandLine .8s ease both;
}
.header-eyebrow {
  font-family: var(--fm);
  font-size: 10px;
  letter-spacing: .25em;
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: 12px;
  opacity: 0;
  animation: fadeUp .7s .1s ease both;
}
.header h1 {
  font-family: var(--fd);
  font-size: 52px;
  font-weight: 300;
  letter-spacing: -.02em;
  line-height: 1;
  color: var(--chalk);
  margin-bottom: 10px;
  opacity: 0;
  animation: fadeUp .7s .2s ease both;
}
.header h1 em {
  font-style: italic;
  color: var(--gold2);
}
.header p {
  font-size: 13px;
  color: var(--chalk3);
  font-weight: 300;
  letter-spacing: .01em;
  opacity: 0;
  animation: fadeUp .7s .3s ease both;
}

/* ── Upload zone ── */
.upload-zone {
  position: relative;
  margin-bottom: 12px;
  opacity: 0;
  animation: fadeUp .7s .4s ease both;
}
.upload-area {
  background: var(--ink2);
  border: 1px solid var(--ink5);
  border-radius: var(--r);
  padding: 40px 20px;
  text-align: center;
  cursor: pointer;
  transition: border-color .3s, background .3s, transform .2s;
  position: relative;
  overflow: hidden;
}
.upload-area::before {
  content: '';
  position: absolute; inset: 0;
  background: radial-gradient(ellipse at 50% 0%, rgba(201,169,110,.05) 0%, transparent 60%);
  opacity: 0;
  transition: opacity .3s;
}
.upload-area:hover { border-color: var(--gold); transform: translateY(-2px); }
.upload-area:hover::before { opacity: 1; }
.upload-area.has-grid { padding: 12px; border-color: var(--gold); }
.upload-icon-wrap {
  display: flex; align-items: center; justify-content: center;
  width: 64px; height: 64px;
  border-radius: 50%;
  background: var(--ink3);
  border: 1px solid var(--ink5);
  margin: 0 auto 18px;
  transition: all .3s;
}
.upload-area:hover .upload-icon-wrap {
  background: var(--golddim);
  border-color: rgba(201,169,110,.3);
}
.upload-icon { font-size: 28px; display: block; }
.upload-title {
  font-family: var(--fd);
  font-size: 20px;
  font-weight: 400;
  color: var(--chalk2);
  margin-bottom: 4px;
  letter-spacing: .01em;
}
.upload-sub {
  font-size: 11px;
  font-family: var(--fm);
  color: var(--chalk4);
  letter-spacing: .06em;
}

/* Multi-image grid */
.preview-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
}
.preview-thumb {
  position: relative;
  aspect-ratio: 1;
  border-radius: var(--rsm);
  overflow: hidden;
  background: var(--ink3);
}
.preview-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.preview-thumb-del {
  position: absolute; top: 5px; right: 5px;
  width: 22px; height: 22px;
  border-radius: 50%;
  background: rgba(10,9,7,.8);
  border: 1px solid var(--ink5);
  color: var(--chalk2);
  font-size: 13px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  backdrop-filter: blur(4px);
  transition: background .15s;
}
.preview-thumb-del:hover { background: var(--reddim); color: var(--red); }
.preview-add-thumb {
  aspect-ratio: 1;
  border-radius: var(--rsm);
  border: 1px dashed var(--ink5);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  color: var(--chalk4);
  font-size: 24px;
  transition: border-color .2s, color .2s;
}
.preview-add-thumb:hover { border-color: var(--gold); color: var(--gold); }
.preview-count {
  font-size: 11px;
  font-family: var(--fm);
  color: var(--chalk3);
  text-align: center;
  padding: 10px 0 4px;
  letter-spacing: .05em;
}

/* Inputs hidden */
#fileCamera, #fileGallery { display: none; }

/* ── Buttons ── */
.btn {
  width: 100%;
  padding: 17px;
  background: var(--gold);
  color: var(--ink);
  border: none;
  border-radius: var(--r);
  font-size: 13px;
  font-family: var(--fm);
  font-weight: 500;
  letter-spacing: .12em;
  text-transform: uppercase;
  cursor: pointer;
  transition: all .2s;
  position: relative;
  overflow: hidden;
}
.btn::after {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(135deg, rgba(255,255,255,.15) 0%, transparent 60%);
  opacity: 0;
  transition: opacity .2s;
}
.btn:not(:disabled):hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(201,169,110,.25); }
.btn:not(:disabled):hover::after { opacity: 1; }
.btn:not(:disabled):active { transform: translateY(0); }
.btn:disabled { background: var(--ink4); color: var(--chalk4); cursor: not-allowed; }
.btn-ghost {
  width: 100%;
  padding: 15px;
  background: transparent;
  color: var(--chalk3);
  border: 1px solid var(--ink5);
  border-radius: var(--r);
  font-size: 12px;
  font-family: var(--fm);
  letter-spacing: .1em;
  text-transform: uppercase;
  cursor: pointer;
  transition: all .2s;
  margin-top: 10px;
}
.btn-ghost:hover { border-color: var(--gold); color: var(--gold); }

.detect-btn-wrap {
  margin-bottom: 12px;
  opacity: 0;
  animation: fadeUp .7s .5s ease both;
}
.manual-entry {
  text-align: center;
  margin-bottom: 32px;
  opacity: 0;
  animation: fadeUp .7s .6s ease both;
}
.manual-link {
  font-size: 12px;
  font-family: var(--fm);
  color: var(--chalk4);
  letter-spacing: .06em;
  cursor: pointer;
  background: none; border: none;
  text-decoration: underline;
  text-decoration-color: rgba(201,169,110,.2);
  text-underline-offset: 3px;
  transition: color .2s;
}
.manual-link:hover { color: var(--gold); }

/* ── Pick menu (bottom sheet) ── */
.pick-menu {
  position: fixed; inset: 0; z-index: 300;
  display: flex; align-items: flex-end; justify-content: center;
  padding: 0 16px env(safe-area-inset-bottom, 20px);
}
.pick-backdrop {
  position: absolute; inset: 0;
  background: rgba(5,4,3,.75);
  backdrop-filter: blur(8px);
  animation: bdin .2s ease both;
}
.pick-sheet {
  position: relative;
  width: 100%; max-width: 430px;
  background: var(--ink3);
  border: 1px solid var(--ink5);
  border-radius: 24px 24px 20px 20px;
  padding: 8px 16px 24px;
  animation: sheetUp .3s cubic-bezier(.32,0,.15,1) both;
  box-shadow: 0 -20px 60px rgba(0,0,0,.4);
}
.pick-handle {
  width: 36px; height: 4px;
  background: var(--ink5);
  border-radius: 999px;
  margin: 8px auto 20px;
}
.pick-title {
  font-family: var(--fm);
  font-size: 10px;
  letter-spacing: .2em;
  text-transform: uppercase;
  color: var(--chalk4);
  text-align: center;
  margin-bottom: 16px;
}
.pick-options { display: flex; flex-direction: column; gap: 8px; }
.pick-option {
  width: 100%;
  padding: 16px 18px;
  background: var(--ink4);
  border: 1px solid var(--ink5);
  border-radius: var(--r);
  color: var(--chalk);
  font-family: var(--fb);
  cursor: pointer;
  display: flex; align-items: center; gap: 14px;
  transition: all .18s;
  text-align: left;
}
.pick-option:hover { border-color: var(--gold); background: var(--golddim); }
.pick-option-icon {
  width: 44px; height: 44px;
  border-radius: 12px;
  background: var(--ink3);
  border: 1px solid var(--ink5);
  display: flex; align-items: center; justify-content: center;
  font-size: 22px;
  flex-shrink: 0;
  transition: all .18s;
}
.pick-option:hover .pick-option-icon { background: var(--golddim); border-color: rgba(201,169,110,.3); }
.pick-option-text { display: flex; flex-direction: column; gap: 2px; }
.pick-option-title { font-size: 14px; font-weight: 500; }
.pick-option-sub { font-size: 11px; color: var(--chalk3); }
.pick-cancel {
  width: 100%; padding: 15px; margin-top: 8px;
  background: transparent; border: 1px solid var(--ink5);
  border-radius: var(--r); color: var(--chalk3);
  font-size: 12px; font-family: var(--fm);
  letter-spacing: .1em; text-transform: uppercase;
  cursor: pointer; transition: all .18s;
}
.pick-cancel:hover { border-color: var(--red); color: var(--red); }

/* ── Loading ── */
.loading {
  display: none;
  padding: 72px 0;
  text-align: center;
}
.candle-wrap {
  position: relative;
  width: 60px; height: 60px;
  margin: 0 auto 28px;
}
.candle-ring {
  position: absolute; inset: 0;
  border-radius: 50%;
  border: 1px solid transparent;
}
.candle-ring:nth-child(1) {
  border-top-color: var(--gold);
  animation: spin 2s linear infinite;
}
.candle-ring:nth-child(2) {
  inset: 8px;
  border-right-color: rgba(201,169,110,.4);
  animation: spin 3s linear infinite reverse;
}
.candle-ring:nth-child(3) {
  inset: 16px;
  border-bottom-color: rgba(201,169,110,.15);
  animation: spin 4s linear infinite;
}
.candle-flame {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  font-size: 20px;
  animation: flamePulse 1.5s ease-in-out infinite;
}
.loading-text {
  font-family: var(--fd);
  font-size: 22px;
  font-weight: 300;
  font-style: italic;
  color: var(--chalk2);
  margin-bottom: 8px;
  transition: opacity .3s;
}
.loading-sub {
  font-family: var(--fm);
  font-size: 11px;
  color: var(--chalk4);
  letter-spacing: .1em;
}

/* ── Error ── */
.error-box {
  display: none;
  background: var(--reddim);
  border: 1px solid rgba(176,85,85,.2);
  border-radius: var(--r);
  padding: 16px;
  margin-top: 12px;
  animation: fadeUp .25s ease both;
}
.error-msg {
  font-size: 13px;
  color: #e08080;
  margin-bottom: 12px;
  line-height: 1.55;
}
.error-actions { display: flex; gap: 8px; }
.error-btn {
  flex: 1; padding: 9px 12px;
  border-radius: var(--rsm);
  font-size: 11px; font-family: var(--fm);
  letter-spacing: .06em; text-transform: uppercase;
  cursor: pointer; border: none; transition: opacity .2s;
}
.error-btn-retry { background: rgba(176,85,85,.2); color: #e08080; }
.error-btn-manual { background: var(--golddim); color: var(--gold); border: 1px solid rgba(201,169,110,.2) !important; }

/* ── Manual screen ── */
.manual-screen { display: none; animation: fadeUp .35s ease both; }
.screen-header {
  display: flex; align-items: baseline; justify-content: space-between;
  margin-bottom: 20px; padding-top: 8px;
}
.screen-title {
  font-family: var(--fd);
  font-size: 28px;
  font-weight: 300;
  letter-spacing: -.01em;
}
.screen-hint {
  font-family: var(--fm);
  font-size: 10px;
  color: var(--chalk4);
  letter-spacing: .08em;
}
.tags-wrap {
  background: var(--ink2);
  border: 1px solid var(--ink5);
  border-radius: var(--r);
  padding: 14px;
  margin-bottom: 12px;
  min-height: 70px;
}
.tags-list { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 10px; }
.tag {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--golddim);
  color: var(--gold2);
  border: 1px solid rgba(201,169,110,.2);
  border-radius: 999px;
  padding: 5px 10px 5px 13px;
  font-size: 12px;
  font-family: var(--fm);
  letter-spacing: .04em;
  animation: popIn .2s cubic-bezier(.4,0,.2,1) both;
}
.tag-del {
  width: 15px; height: 15px;
  border-radius: 50%;
  background: rgba(201,169,110,.15);
  border: none;
  color: var(--gold);
  font-size: 11px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background .15s;
}
.tag-del:hover { background: rgba(201,169,110,.35); }
.add-row { display: flex; gap: 8px; }
.tag-input {
  flex: 1; height: 36px;
  background: var(--ink3);
  border: 1px solid var(--ink5);
  border-radius: var(--rsm);
  color: var(--chalk);
  font-size: 13px;
  font-family: var(--fb);
  padding: 0 12px;
  outline: none;
  transition: border-color .2s;
}
.tag-input:focus { border-color: var(--gold); }
.tag-input::placeholder { color: var(--chalk4); }
.add-btn {
  height: 36px; padding: 0 14px;
  background: var(--golddim);
  border: 1px solid rgba(201,169,110,.2);
  border-radius: var(--rsm);
  color: var(--gold);
  font-size: 12px; font-family: var(--fm);
  letter-spacing: .06em;
  cursor: pointer; white-space: nowrap;
  transition: background .15s;
}
.add-btn:hover { background: rgba(201,169,110,.2); }
.tag-count {
  font-family: var(--fm);
  font-size: 10px;
  color: var(--chalk4);
  letter-spacing: .08em;
  text-align: right;
  margin: 8px 0 16px;
}

/* Suggestions */
.suggest-label {
  font-family: var(--fm);
  font-size: 10px;
  color: var(--chalk4);
  letter-spacing: .12em;
  text-transform: uppercase;
  margin-bottom: 8px;
}
.suggest-row {
  display: flex; flex-wrap: wrap; gap: 6px;
  margin-bottom: 16px;
  min-height: 30px;
}
.suggest-chip {
  font-size: 11px; font-family: var(--fm);
  padding: 4px 11px;
  border-radius: 999px;
  background: var(--ink3);
  color: var(--chalk3);
  border: 1px dashed var(--ink5);
  cursor: pointer;
  transition: all .18s;
  letter-spacing: .04em;
}
.suggest-chip:hover { border-color: var(--gold); color: var(--gold); background: var(--golddim); }

/* ── Prefs panel ── */
.prefs-panel {
  background: var(--ink2);
  border: 1px solid var(--ink5);
  border-radius: var(--r);
  padding: 18px;
  margin-bottom: 14px;
}
.prefs-section { margin-bottom: 16px; }
.prefs-section:last-child { margin-bottom: 0; }
.prefs-label {
  font-family: var(--fm);
  font-size: 10px;
  letter-spacing: .15em;
  text-transform: uppercase;
  color: var(--chalk4);
  margin-bottom: 10px;
}
.prefs-row { display: flex; flex-wrap: wrap; gap: 6px; }
.pref-chip {
  font-size: 12px; font-family: var(--fb);
  padding: 6px 13px;
  border-radius: 999px;
  background: transparent;
  border: 1px solid var(--ink5);
  color: var(--chalk3);
  cursor: pointer;
  transition: all .18s;
}
.pref-chip:hover { border-color: var(--chalk4); color: var(--chalk); }
.pref-chip.active {
  background: var(--golddim);
  border-color: rgba(201,169,110,.35);
  color: var(--gold2);
}

/* ── Result screen ── */
.result { display: none; animation: fadeUp .4s ease both; }
.result-header {
  display: flex; align-items: flex-end; justify-content: space-between;
  margin-bottom: 20px; padding-top: 8px;
}
.result-title-wrap {}
.result-eyebrow {
  font-family: var(--fm);
  font-size: 10px;
  letter-spacing: .15em;
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: 4px;
}
.result-title {
  font-family: var(--fd);
  font-size: 28px;
  font-weight: 300;
  letter-spacing: -.01em;
}
.result-actions { display: flex; gap: 8px; align-items: center; }
.result-count {
  font-family: var(--fm);
  font-size: 11px;
  color: var(--chalk4);
  background: var(--ink3);
  padding: 4px 11px;
  border-radius: 999px;
  border: 1px solid var(--ink5);
  letter-spacing: .05em;
}
.history-btn {
  font-family: var(--fm);
  font-size: 11px;
  color: var(--chalk4);
  background: var(--ink3);
  padding: 4px 11px;
  border-radius: 999px;
  border: 1px solid var(--ink5);
  cursor: pointer;
  transition: all .18s;
  letter-spacing: .05em;
}
.history-btn:hover { border-color: var(--gold); color: var(--gold); }

/* Ingredient bar */
.ing-bar {
  background: var(--ink2);
  border: 1px solid var(--ink5);
  border-radius: var(--r);
  padding: 16px 18px;
  margin-bottom: 18px;
}
.ing-bar-head {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 12px;
}
.ing-bar-label {
  font-family: var(--fm);
  font-size: 10px;
  letter-spacing: .15em;
  text-transform: uppercase;
  color: var(--chalk4);
}
.ing-bar-hint { font-size: 11px; color: var(--chalk4); }
.result-tags-list { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 10px; }
.result-add-row { display: flex; gap: 8px; margin-bottom: 12px; }

.result-prefs {

  border: 1px solid var(--ink5);
  border-radius: var(--r);
  padding: 16px 18px;
  margin-bottom: 12px;

  background: var(--gold);
  color: var(--ink);

  border-radius: var(--rsm);
  font-family: var(--fm);
  font-size: 11px;
  font-weight: 500;
  letter-spacing: .12em;
  text-transform: uppercase;

  transition: all .18s;
}
.regen-btn:hover { transform: translateY(-1px); box-shadow: 0 8px 24px rgba(201,169,110,.2); }

/* ── Sort bar ── */
.sort-bar {
  display: flex; gap: 6px; flex-wrap: wrap;
  margin-bottom: 16px;
  align-items: center;
}
.sort-label {
  font-family: var(--fm);
  font-size: 10px;
  color: var(--chalk4);
  letter-spacing: .1em;
  text-transform: uppercase;
  margin-right: 4px;
}
.sort-chip {
  font-size: 11px; font-family: var(--fm);
  padding: 5px 11px;
  border-radius: 999px;
  background: var(--ink3);
  border: 1px solid var(--ink5);
  color: var(--chalk4);
  cursor: pointer;
  transition: all .18s;
  display: inline-flex; align-items: center; gap: 4px;
  letter-spacing: .04em;
}
.sort-chip:hover { border-color: var(--chalk4); color: var(--chalk2); }
.sort-chip.active { background: var(--golddim); border-color: rgba(201,169,110,.3); color: var(--gold); }
.sort-arrow { font-size: 9px; transition: transform .2s; }
.sort-chip.desc .sort-arrow { transform: rotate(180deg); }

/* ── Recipe cards ── */
.recipe-cards { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }
.recipe-card {
  background: var(--ink2);
  border: 1px solid var(--ink5);
  border-radius: var(--r);
  overflow: hidden;
  transition: border-color .25s, transform .25s;
}
.recipe-card:hover { border-color: rgba(201,169,110,.25); transform: translateY(-1px); }
.recipe-card.open { border-color: rgba(201,169,110,.3); }
.recipe-card-header {
  padding: 20px 20px 16px;
  cursor: pointer;
  user-select: none;
  display: flex; align-items: flex-start; justify-content: space-between; gap: 14px;
}
.recipe-card-left { flex: 1; }
.recipe-num {
  font-family: var(--fm);
  font-size: 10px;
  letter-spacing: .2em;
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: 6px;
}
.recipe-name {
  font-family: var(--fd);
  font-size: 24px;
  font-weight: 400;
  line-height: 1.2;
  margin-bottom: 12px;
  letter-spacing: -.01em;
}
.recipe-meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.badge {
  font-family: var(--fm);
  font-size: 10px;
  letter-spacing: .06em;
  padding: 3px 9px;
  border-radius: 999px;
  border: 1px solid;
}
.badge-time { background: var(--golddim); color: var(--gold2); border-color: rgba(201,169,110,.2); }
.badge-easy { background: var(--greendim); color: var(--green); border-color: rgba(107,158,122,.2); }
.badge-medium { background: var(--bluedim); color: var(--blue); border-color: rgba(90,122,170,.2); }
.badge-hard { background: var(--reddim); color: var(--red); border-color: rgba(176,85,85,.2); }
.badge-cal { background: var(--ink3); color: var(--chalk3); border-color: var(--ink5); }
.share-btn {
  font-family: var(--fm);
  font-size: 10px;
  letter-spacing: .06em;
  padding: 3px 9px;
  border-radius: 999px;
  background: var(--ink3);
  color: var(--chalk4);
  border: 1px solid var(--ink5);
  cursor: pointer;
  transition: all .18s;
}
.share-btn:hover { border-color: var(--gold); color: var(--gold); }
.share-btn.copied { background: var(--greendim); color: var(--green); border-color: rgba(107,158,122,.25); }
.recipe-toggle {
  width: 30px; height: 30px;
  border-radius: 50%;
  background: var(--ink3);
  border: 1px solid var(--ink5);
  display: flex; align-items: center; justify-content: center;
  font-size: 12px;
  color: var(--chalk4);
  flex-shrink: 0;
  transition: all .3s cubic-bezier(.4,0,.2,1);
  margin-top: 2px;
}
.recipe-card.open .recipe-toggle {
  transform: rotate(180deg);
  background: var(--golddim);
  border-color: rgba(201,169,110,.25);
  color: var(--gold);
}
.recipe-body {
  max-height: 0;
  overflow: hidden;
  transition: max-height .5s cubic-bezier(.4,0,.2,1);
}
.recipe-card.open .recipe-body { max-height: 1400px; }
.recipe-body-inner {
  padding: 0 20px 22px;
  border-top: 1px solid var(--ink5);
}
.recipe-divider {
  width: 30px; height: 1px;
  background: var(--gold);
  opacity: .3;
  margin: 18px 0;
}
.body-label {
  font-family: var(--fm);
  font-size: 10px;
  letter-spacing: .15em;
  text-transform: uppercase;
  color: var(--chalk4);
  margin-bottom: 10px;
}
.recipe-ings { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 4px; }
.recipe-ing-chip {
  font-family: var(--fm);
  font-size: 10px;
  letter-spacing: .04em;
  padding: 3px 9px;
  border-radius: 999px;
  background: var(--ink3);
  color: var(--chalk3);
  border: 1px solid var(--ink5);
}
.steps-list { display: flex; flex-direction: column; gap: 12px; margin-bottom: 4px; }
.step { display: flex; gap: 14px; align-items: flex-start; }
.step-num {
  font-family: var(--fm);
  font-size: 11px;
  color: var(--gold);
  flex-shrink: 0;
  margin-top: 1px;
  min-width: 18px;
  letter-spacing: .04em;
}
.step-text {
  font-size: 13px;
  color: var(--chalk2);
  line-height: 1.7;
  font-weight: 300;
}
.tip-box {
  background: var(--goldfog);
  border: 1px solid rgba(201,169,110,.12);
  border-radius: var(--rsm);
  padding: 11px 14px;
  font-size: 12px;
  color: var(--chalk3);
  line-height: 1.6;
  margin-top: 16px;
}
.tip-label { color: var(--gold); font-weight: 500; margin-right: 4px; font-size: 13px; }

/* ── History ── */
.history-panel { display: none; animation: fadeUp .35s ease both; }
.history-panel-header {
  display: flex; align-items: flex-end; justify-content: space-between;
  margin-bottom: 20px; padding-top: 8px;
}
.history-panel-title {
  font-family: var(--fd);
  font-size: 28px;
  font-weight: 300;
}
.history-clear {
  font-family: var(--fm);
  font-size: 10px;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--chalk4);
  background: none; border: none;
  cursor: pointer; padding: 4px 8px;
  transition: color .15s;
}
.history-clear:hover { color: var(--red); }
.history-empty {
  text-align: center; padding: 48px 0;
  font-family: var(--fd);
  font-size: 18px;
  font-style: italic;
  color: var(--chalk4);
}
.history-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
.history-item {
  background: var(--ink2);
  border: 1px solid var(--ink5);
  border-radius: var(--r);
  padding: 14px 16px;
  cursor: pointer;
  transition: all .2s;
}
.history-item:hover { border-color: rgba(201,169,110,.25); transform: translateY(-1px); }
.history-item-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.history-item-time { font-family: var(--fm); font-size: 10px; color: var(--chalk4); letter-spacing: .04em; }
.history-item-meta { display: flex; gap: 6px; }
.history-item-lang {
  font-family: var(--fm); font-size: 10px;
  color: var(--gold); background: var(--golddim);
  padding: 2px 8px; border-radius: 999px;
  letter-spacing: .08em;
}
.history-item-count {
  font-family: var(--fm); font-size: 10px;
  color: var(--chalk4); background: var(--ink3);
  padding: 2px 8px; border-radius: 999px;
  letter-spacing: .04em;
}
.history-item-ings { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 8px; }
.history-ing {
  font-family: var(--fm); font-size: 10px;
  padding: 2px 8px; border-radius: 999px;
  background: var(--golddim); color: var(--gold2);
  border: 1px solid rgba(201,169,110,.15);
}
.history-item-recipes { font-size: 12px; color: var(--chalk3); line-height: 1.5; font-weight: 300; }

/* ── Keyframes ── */
@keyframes fadeUp   { from{opacity:0;transform:translateY(18px)} to{opacity:1;transform:translateY(0)} }
@keyframes fadeDown { from{opacity:0;transform:translateY(-14px)} to{opacity:1;transform:translateY(0)} }
@keyframes expandLine { from{width:0;opacity:0} to{width:40px;opacity:.6} }
@keyframes popIn    { from{opacity:0;transform:scale(.65)} to{opacity:1;transform:scale(1)} }
@keyframes spin     { to{transform:rotate(360deg)} }
@keyframes flamePulse { 0%,100%{transform:translate(-50%,-50%) scale(1);opacity:1} 50%{transform:translate(-50%,-50%) scale(.8);opacity:.6} }
@keyframes bdin     { from{opacity:0} to{opacity:1} }
@keyframes sheetUp  { from{transform:translateY(100%)} to{transform:translateY(0)} }
</style>

// ── State ──
const HISTORY_KEY='recipe_history',MAX_HISTORY=10,LANG_LABELS={zh:'中文',en:'English',fr:'Français',es:'Español'};
const API_BASE='';
let ingredients=[],currentLang='zh',prevScreen='screen-result',tipTimer=null,isLoading=false,currentRequestId=0;
let selectedServings='1-2',selectedDietary=[],selectedStyle='any';
let currentSort='none',currentSortDir='asc';
let selectedFiles=[];

function t(){return I18N[currentLang]||I18N.zh}

// ── Synonyms ──
const SYNONYMS={'番茄':['西红柿'],'土豆':['马铃薯','洋芋'],tomato:['tomatoes'],potato:['potatoes'],egg:['eggs'],onion:['onions','scallion']};
function isSemanticDuplicate(a,b){const l=a.toLowerCase();for(const x of b){const xl=x.toLowerCase();if(xl===l)return true;for(const[k,s]of Object.entries(SYNONYMS)){const all=[k.toLowerCase(),...s.map(v=>v.toLowerCase())];if(all.includes(l)&&all.includes(xl))return true}}return false}

// ── Prefs ──
function renderPrefs(cid,type){const tx=t();if(type==='servings')document.getElementById(cid).innerHTML=tx.servings.map(s=>`<button class="pref-chip${s.v===selectedServings?' active':''}" onclick="setServings('${s.v}')">${s.l}</button>`).join('');else if(type==='dietary')document.getElementById(cid).innerHTML=tx.dietary.map(d=>`<button class="pref-chip${selectedDietary.includes(d.v)?' active':''}" onclick="toggleDietary('${d.v}')">${d.l}</button>`).join('');else if(type==='style')document.getElementById(cid).innerHTML=tx.styles.map(s=>`<button class="pref-chip${s.v===selectedStyle?' active':''}" onclick="setStyle('${s.v}')">${s.l}</button>`).join('')}
function renderAllPrefs(){['servingsRow','rServingsRow'].forEach(id=>renderPrefs(id,'servings'));['dietaryRow','rDietaryRow'].forEach(id=>renderPrefs(id,'dietary'));['styleRow','rStyleRow'].forEach(id=>renderPrefs(id,'style'))}
function setServings(v){selectedServings=v;renderAllPrefs()}
function toggleDietary(v){const i=selectedDietary.indexOf(v);i===-1?selectedDietary.push(v):selectedDietary.splice(i,1);renderAllPrefs()}
function setStyle(v){selectedStyle=v;renderAllPrefs()}

// ── Language ──
function toggleLangDropdown(e){if(e)e.stopPropagation();if(isLoading)return;document.getElementById('langDropdown').classList.toggle('open')}
document.addEventListener('click',e=>{const dd=document.getElementById('langDropdown');if(dd&&!dd.contains(e.target))dd.classList.remove('open')});
function switchLang(lang){if(isLoading)return;currentLang=lang;document.body.className=`lang-${lang}`;document.querySelector('html').lang=lang;document.getElementById('langCurrentLabel').textContent=LANG_LABELS[lang];document.querySelectorAll('.lang-option').forEach(o=>o.classList.toggle('active',o.dataset.lang===lang));document.getElementById('langDropdown').classList.remove('open');applyI18n();localStorage.setItem('recipe_lang',lang)}

function setInnerHTML(id,v){const el=document.getElementById(id);if(el)el.innerHTML=v}
function setText(id,v){const el=document.getElementById(id);if(el)el.textContent=v}

function applyI18n(){
  const tx=t();
  setText('t-eyebrow',tx.eyebrow);
  setInnerHTML('t-title',tx.title);
  setText('t-subtitle',tx.subtitle);
  setText('t-uploadTitle',tx.uploadTitle);
  setText('t-uploadSub',tx.uploadSub);
  setText('t-detectBtn',tx.detectBtn);
  setText('t-manualLink',tx.manualLink);
  setText('t-pickTitle',tx.pickTitle);setText('t-pickCamera',tx.pickCamera);setText('t-pickCameraSub',tx.pickCameraSub);
  setText('t-pickGallery',tx.pickGallery);setText('t-pickGallerySub',tx.pickGallerySub);setText('t-pickCancel',tx.pickCancel);
  setText('t-manualTitle',tx.manualTitle.replace(/<[^>]+>/g,''));
  setText('t-manualHint',tx.manualHint);setText('t-addBtn',tx.addBtn);
  document.getElementById('tagInput').placeholder=tx.tagPlaceholder;
  setText('t-suggestLabel',tx.suggestLabel);
  setText('t-servingsLabel',tx.servingsLabel);setText('t-dietaryLabel',tx.dietaryLabel);setText('t-styleLabel',tx.styleLabel);
  setText('t-generateBtn',tx.generateBtn);setText('t-backBtn',tx.backBtn);
  setText('t-resultEyebrow',tx.resultEyebrow);
  setInnerHTML('t-resultTitle',tx.resultTitle);
  setText('t-historyBtn',tx.historyBtn);
  setText('t-ingLabel',tx.ingLabel);setText('t-ingEditHint',tx.ingEditHint);setText('t-resultAddBtn',tx.resultAddBtn);
  document.getElementById('resultTagInput').placeholder=tx.tagPlaceholder;
  setText('t-rServingsLabel',tx.servingsLabel);setText('t-rDietaryLabel',tx.dietaryLabel);setText('t-rStyleLabel',tx.styleLabel);
  setText('t-regenBtn',tx.regenBtn);setText('t-resultRetakeBtn',tx.resultRetakeBtn);
  setInnerHTML('t-historyTitle',tx.historyTitle);
  setText('t-historyClear',tx.historyClear);setText('t-historyBack',tx.historyBack);
  renderEditTags();renderAllPrefs();if(selectedFiles.length)renderPreviews();
}

// ── EXIF fix ──
async function fixImageOrientation(file){return new Promise(r=>{const img=new Image;img.onload=()=>{const c=document.createElement('canvas'),ctx=c.getContext('2d'),mx=1600;let{width:w,height:h}=img;if(w>mx||h>mx){const ra=Math.min(mx/w,mx/h);w*=ra;h*=ra}c.width=w;c.height=h;ctx.drawImage(img,0,0,w,h);c.toBlob(b=>r(b||file),'image/jpeg',.85)};img.onerror=()=>r(file);img.src=URL.createObjectURL(file)})}

// ── Screens ──
function showScreen(n){['screen-upload','screen-manual','screen-result','screen-history'].forEach(id=>{document.getElementById(id).style.display='none'});if(n){const el=document.getElementById(n);el.style.display='block';el.style.animation='none';requestAnimationFrame(()=>{el.style.animation=''})}}
function showLoading(txt,sub){document.getElementById('loadingText').textContent=txt;document.getElementById('loadingSub').textContent=sub;document.getElementById('loading').style.display='block';isLoading=true;document.getElementById('langTrigger').disabled=true;document.getElementById('langDropdown').classList.remove('open')}
function hideLoading(){document.getElementById('loading').style.display='none';if(tipTimer){clearInterval(tipTimer);tipTimer=null}isLoading=false;document.getElementById('langTrigger').disabled=false}
function startTips(){if(tipTimer)clearInterval(tipTimer);const tips=t().loadingTips;let i=0;tipTimer=setInterval(()=>{i=(i+1)%tips.length;const el=document.getElementById('loadingText');el.style.opacity='0';setTimeout(()=>{el.textContent=tips[i];el.style.opacity='1'},200)},3200)}
function showError(m,a=[]){document.getElementById('errorMsg').textContent=m;document.getElementById('errorActions').innerHTML=a.map(x=>`<button class="error-btn ${x.cls}" onclick="${x.fn}">${x.label}</button>`).join('');document.getElementById('errorBox').style.display='block'}
function hideError(){document.getElementById('errorBox').style.display='none'}

// ── Pick menu ──
function openPickMenu(){if(isLoading)return;document.getElementById('pickMenu').style.display='flex'}
function closePickMenu(e){if(e&&!e.target.classList.contains('pick-backdrop')&&e.target.id!=='pickMenu')return;document.getElementById('pickMenu').style.display='none'}
function triggerCamera(){document.getElementById('pickMenu').style.display='none';document.getElementById('fileCamera').click()}
function triggerGallery(){document.getElementById('pickMenu').style.display='none';document.getElementById('fileGallery').click()}

document.getElementById('fileCamera').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;selectedFiles=[f];renderPreviews();e.target.value=''});
document.getElementById('fileGallery').addEventListener('change',e=>{const files=Array.from(e.target.files);if(!files.length)return;selectedFiles=[...selectedFiles,...files].slice(0,5);renderPreviews();e.target.value=''});

function renderPreviews(){
  const grid=document.getElementById('previewGrid'),count=document.getElementById('previewCount'),dBtn=document.getElementById('detectBtn'),def=document.getElementById('uploadDefault');
  if(!selectedFiles.length){grid.style.display='none';count.style.display='none';dBtn.disabled=true;def.style.display='block';document.getElementById('uploadArea').classList.remove('has-grid');return}
  def.style.display='none';document.getElementById('uploadArea').classList.add('has-grid');
  grid.style.display='grid';count.style.display='block';count.textContent=t().previewCount(selectedFiles.length);
  grid.innerHTML=selectedFiles.map((f,i)=>`<div class="preview-thumb"><img src="${URL.createObjectURL(f)}"><button class="preview-thumb-del" onclick="removePreview(${i})">×</button></div>`).join('')+(selectedFiles.length<5?`<div class="preview-add-thumb" onclick="openPickMenu()">+</div>`:'');
  dBtn.disabled=false;
}
function removePreview(i){selectedFiles.splice(i,1);renderPreviews()}

// ── Tags ──
document.getElementById('tagInput').addEventListener('keydown',e=>{if(e.key==='Enter')addTag('tagInput',renderEditTags)});
document.getElementById('resultTagInput').addEventListener('keydown',e=>{if(e.key==='Enter')addTag('resultTagInput',renderResultTags)});
function addTag(id,fn){const input=document.getElementById(id),val=input.value.trim();if(!val||val.length>20)return input.value='';if(isSemanticDuplicate(val,ingredients))return input.value='';ingredients.push(val);input.value='';fn();if(id==='tagInput')fetchSuggestions()}
function removeTag(i,fn){ingredients.splice(i,1);fn();if(fn===renderEditTags)fetchSuggestions()}
function renderEditTags(){document.getElementById('tagsList').innerHTML=ingredients.map((g,i)=>`<div class="tag">${g}<button class="tag-del" onclick="removeTag(${i},renderEditTags)">×</button></div>`).join('');document.getElementById('tagCount').textContent=t().tagCountLabel(ingredients.length)}
function renderResultTags(){document.getElementById('resultTagsList').innerHTML=ingredients.map((g,i)=>`<div class="tag">${g}<button class="tag-del" onclick="removeTag(${i},renderResultTags)">×</button></div>`).join('')}
function goManual(){if(isLoading)return;hideError();ingredients=[];renderEditTags();document.getElementById('suggestionsRow').innerHTML='';document.getElementById('t-suggestLabel').style.display='none';showScreen('screen-manual')}

// ── Suggestions ──
let suggestTimer=null;
async function fetchSuggestions(){if(!ingredients.length){document.getElementById('suggestionsRow').innerHTML='';document.getElementById('t-suggestLabel').style.display='none';return}clearTimeout(suggestTimer);suggestTimer=setTimeout(async()=>{const tx=t();document.getElementById('t-suggestLabel').style.display='block';document.getElementById('t-suggestLabel').textContent=tx.suggestLoading;try{const res=await fetch(`${API_BASE}/suggest`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ingredients,lang:currentLang})});const data=await res.json();if(data.success&&data.suggestions.length>0){document.getElementById('t-suggestLabel').textContent=tx.suggestLabel;document.getElementById('suggestionsRow').innerHTML=data.suggestions.map(s=>`<button class="suggest-chip" onclick="addSuggestion('${s.replace(/'/g,"\\'")}')">${s}</button>`).join('')}else{document.getElementById('t-suggestLabel').style.display='none';document.getElementById('suggestionsRow').innerHTML=''}}catch{document.getElementById('t-suggestLabel').style.display='none'}},800)}
function addSuggestion(s){if(isSemanticDuplicate(s,ingredients))return;ingredients.push(s);renderEditTags();fetchSuggestions()}

// ── Share ──
function shareRecipe(btn,idx){const r=(window._currentRecipes||[])[idx];if(!r)return;const tx=t(),text=`【${r.name}】 ${r.time_min}min · ${r.difficulty} · ${r.calories}cal\n\n${tx.ingredientsLabel}: ${r.ingredients.join(', ')}\n\n${tx.stepsLabel}:\n${r.steps.map((s,i)=>`${i+1}. ${s}`).join('\n')}\n\n💡 ${r.tip}`;const fin=()=>{btn.textContent=tx.shareCopied;btn.classList.add('copied');setTimeout(()=>{btn.textContent=tx.shareBtn;btn.classList.remove('copied')},2000)};if(navigator.clipboard)navigator.clipboard.writeText(text).then(fin).catch(()=>fb(text,fin));else fb(text,fin)}
function fb(text,cb){const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);cb()}

// ── History ──
function loadHistory(){try{return JSON.parse(localStorage.getItem(HISTORY_KEY))||[]}catch{return[]}}
function saveToHistory(data){let h=loadHistory();h.unshift({id:Date.now(),time:new Date().toLocaleString(),lang:currentLang,ingredients:data.ingredients,recipes:data.recipes.map(r=>({name:r.name,time_min:r.time_min,difficulty:r.difficulty,calories:r.calories,ingredients:r.ingredients,steps:r.steps,tip:r.tip}))});while(h.length>0){try{const sl=h.slice(0,MAX_HISTORY),sr=JSON.stringify(sl);if(sr.length>3*1024*1024){h=h.slice(0,Math.max(1,h.length-1));continue}localStorage.setItem(HISTORY_KEY,sr);break}catch{if(h.length<=1){localStorage.removeItem(HISTORY_KEY);break}h=h.slice(0,h.length-1)}}}
function clearHistory(){if(!confirm(t().confirmClear))return;localStorage.removeItem(HISTORY_KEY);renderHistoryList()}
function showHistory(){if(isLoading)return;prevScreen=window._currentRecipes?'screen-result':'screen-upload';renderHistoryList();showScreen('screen-history')}
function backFromHistory(){showScreen(prevScreen)}
function renderHistoryList(){const h=loadHistory(),tx=t(),el=document.getElementById('historyList');if(!h.length){el.innerHTML=`<div class="history-empty">${tx.historyEmpty}</div>`;return}el.innerHTML='<div class="history-list">'+h.map(r=>`<div class="history-item" onclick="loadHistoryRecord(${r.id})"><div class="history-item-top"><div class="history-item-time">${r.time}</div><div class="history-item-meta"><div class="history-item-lang">${(r.lang||'zh').toUpperCase()}</div><div class="history-item-count">${tx.recipesCount(r.recipes.length)}</div></div></div><div class="history-item-ings">${r.ingredients.map(i=>`<span class="history-ing">${i}</span>`).join('')}</div><div class="history-item-recipes">${r.recipes.map(x=>x.name).join(' · ')}</div></div>`).join('')+'</div>'}
function loadHistoryRecord(id){const r=loadHistory().find(x=>x.id===id);if(!r)return;ingredients=[...r.ingredients];if(r.lang&&r.lang!==currentLang)switchLang(r.lang);renderResult({ingredients:r.ingredients,recipes:r.recipes},false);showScreen('screen-result')}

// ── Sort ──
const DIFF_ORDER={zh:{'简单':1,'中等':2,'较难':3},en:{'Easy':1,'Medium':2,'Hard':3},fr:{'Facile':1,'Moyen':2,'Difficile':3},es:{'Fácil':1,'Medio':2,'Difícil':3}};
function getDiffNum(d){return(DIFF_ORDER[currentLang]||DIFF_ORDER.zh)[d]||2}
function sortRecipes(recipes,sortBy,dir){const s=[...recipes];if(sortBy==='time')s.sort((a,b)=>dir==='asc'?(a.time_min||0)-(b.time_min||0):(b.time_min||0)-(a.time_min||0));else if(sortBy==='difficulty')s.sort((a,b)=>dir==='asc'?getDiffNum(a.difficulty)-getDiffNum(b.difficulty):getDiffNum(b.difficulty)-getDiffNum(a.difficulty));else if(sortBy==='calories')s.sort((a,b)=>dir==='asc'?(a.calories||0)-(b.calories||0):(b.calories||0)-(a.calories||0));return s}
function toggleSort(sortBy){if(currentSort===sortBy){if(currentSortDir==='asc')currentSortDir='desc';else{currentSort='none';currentSortDir='asc'}}else{currentSort=sortBy;currentSortDir='asc'}renderSortBar();if(window._currentRecipes)renderRecipeCards(window._currentRecipes)}
function renderSortBar(){const tx=t(),sorts=[{k:'time',l:tx.sortTime},{k:'difficulty',l:tx.sortDifficulty},{k:'calories',l:tx.sortCalories}];document.getElementById('sortBar').innerHTML=`<span class="sort-label">${tx.sortLabel}</span>`+sorts.map(s=>`<button class="sort-chip${currentSort===s.k?' active':''}${currentSort===s.k&&currentSortDir==='desc'?' desc':''}" onclick="toggleSort('${s.k}')">${s.l}<span class="sort-arrow">${currentSort===s.k?'↑':'·'}</span></button>`).join('')}

// ── API ──
async function runFromPhoto(){
  if(isLoading||!selectedFiles.length)return;
  document.getElementById('detectBtn').disabled=true;hideError();showScreen(null);
  const tx=t();showLoading(tx.loadingPhoto,tx.loadingPhotoSub);startTips();
  const reqId=++currentRequestId;
  try{
    const fd=new FormData;
    for(let i=0;i<selectedFiles.length;i++){const f=await fixImageOrientation(selectedFiles[i]);fd.append('images',f,`photo${i}.jpg`)}
    fd.append('lang',currentLang);fd.append('servings',selectedServings);fd.append('dietary',JSON.stringify(selectedDietary));fd.append('style',selectedStyle);
    const res=await fetch(`${API_BASE}/detect-and-generate`,{method:'POST',body:fd});
    if(reqId!==currentRequestId)return;if(!res.ok)throw{type:'network'};
    const data=await res.json();if(!data.success)throw{type:'api',msg:data.error};
    ingredients=[...data.data.ingredients];renderResult(data.data,true);showScreen('screen-result');
  }catch(err){if(reqId!==currentRequestId)return;showScreen('screen-upload');document.getElementById('detectBtn').disabled=false;handleError(err,'runFromPhoto()')}
  finally{if(reqId===currentRequestId)hideLoading()}
}

async function generateRecipes(){
  if(isLoading||!ingredients.length){if(!ingredients.length)showError(t().errEmpty,[]);return}
  hideError();showScreen(null);const tx=t();showLoading(tx.loadingGenerate,tx.loadingGenerateSub);startTips();
  const reqId=++currentRequestId;
  try{
    const res=await fetch(`${API_BASE}/generate`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ingredients,lang:currentLang,servings:selectedServings,dietary:selectedDietary,style:selectedStyle})});
    if(reqId!==currentRequestId)return;if(!res.ok)throw{type:'network'};
    const data=await res.json();if(!data.success)throw{type:'api'};
    renderResult(data.data,true);showScreen('screen-result');
  }catch(err){if(reqId!==currentRequestId)return;showScreen(window._currentRecipes?'screen-result':'screen-manual');showError(err.type==='network'?tx.errNetwork:tx.errGenerate,[{label:tx.errRetry,cls:'error-btn-retry',fn:'generateRecipes()'}])}
  finally{if(reqId===currentRequestId)hideLoading()}
}

function handleError(err,retryFn){const tx=t();if(err.type==='network')showError(tx.errNetwork,[{label:tx.errRetry,cls:'error-btn-retry',fn:retryFn},{label:tx.errManual,cls:'error-btn-manual',fn:'goManual()'}]);else if(err.msg==='no_ingredients')showError(tx.errNoIngredients,[{label:tx.errRetake,cls:'error-btn-retry',fn:retryFn},{label:tx.errManual,cls:'error-btn-manual',fn:'goManual()'}]);else showError(tx.errDetect,[{label:tx.errRetry,cls:'error-btn-retry',fn:retryFn},{label:tx.errManual,cls:'error-btn-manual',fn:'goManual()'}])}

function diffBadge(d){const e=['简单','Easy','Facile','Fácil'],h=['较难','Hard','Difficile','Difícil'];if(e.includes(d))return`<span class="badge badge-easy">${d}</span>`;if(h.includes(d))return`<span class="badge badge-hard">${d}</span>`;return`<span class="badge badge-medium">${d}</span>`}

function renderResult(data,save=true){
  ingredients=[...data.ingredients];window._currentRecipes=data.recipes;if(save)saveToHistory(data);
  renderResultTags();renderAllPrefs();renderSortBar();
  document.getElementById('resultCount').textContent=t().recipesCount(data.recipes.length);
  renderRecipeCards(data.recipes);
}

function renderRecipeCards(recipes){
  const tx=t();
  const sorted=currentSort!=='none'?sortRecipes(recipes,currentSort,currentSortDir):recipes;
  document.getElementById('recipeCards').innerHTML=sorted.map((r,idx)=>`
<div class="recipe-card" style="animation:fadeUp .45s ${idx*.1}s ease both" onclick="toggleCard(this)">
  <div class="recipe-card-header">
    <div class="recipe-card-left">
      <div class="recipe-num">${tx.recipeLabels[idx]||`#${idx+1}`}</div>
      <div class="recipe-name">${r.name}</div>
      <div class="recipe-meta">
        <span class="badge badge-time">⏱ ${r.time_min} min</span>
        ${diffBadge(r.difficulty)}
        ${r.calories?`<span class="badge badge-cal">🔥 ${r.calories}</span>`:''}
        <button class="share-btn" onclick="event.stopPropagation();shareRecipe(this,${recipes.indexOf(r)})">${tx.shareBtn}</button>
      </div>
    </div>
    <div class="recipe-toggle">▾</div>
  </div>
  <div class="recipe-body">
    <div class="recipe-body-inner">
      <div class="recipe-divider"></div>
      <div class="body-label">${tx.ingredientsLabel}</div>
      <div class="recipe-ings">${r.ingredients.map(i=>`<span class="recipe-ing-chip">${i}</span>`).join('')}</div>
      <div class="recipe-divider"></div>
      <div class="body-label">${tx.stepsLabel}</div>
      <div class="steps-list">${r.steps.map((s,i)=>`<div class="step"><div class="step-num">0${i+1}</div><div class="step-text">${s}</div></div>`).join('')}</div>
      <div class="tip-box"><span class="tip-label">💡</span>${r.tip}</div>
    </div>
  </div>
</div>`).join('');
  const first=document.getElementById('recipeCards').querySelector('.recipe-card');
  if(first)first.classList.add('open');
}

function toggleCard(c){c.classList.toggle('open')}

function resetAll(){
  if(isLoading)return;
  selectedFiles=[];
  document.getElementById('previewGrid').style.display='none';
  document.getElementById('previewCount').style.display='none';
  document.getElementById('uploadDefault').style.display='block';
  document.getElementById('uploadArea').classList.remove('has-grid');
  document.getElementById('detectBtn').disabled=true;
  ingredients=[];window._currentRecipes=null;currentSort='none';currentSortDir='asc';
  hideError();showScreen('screen-upload');
}

// ── Init ──
const savedLang=localStorage.getItem('recipe_lang');
if(savedLang&&I18N[savedLang])switchLang(savedLang);
else applyI18n();
</script>
